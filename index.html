<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Államigazgatás — Napi tanmenet — Közigazgatási szakvizsga 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --kremes: #faf6ed;
  --kremes-melyebb: #f3ebd9;
  --pergamen: #ede2c8;
  --tinta: #1a1f2e;
  --tinta-vilagos: #4a4f5e;
  --tinta-halvany: #7a7f8e;
  --arany: #b8923a;
  --arany-vilagos: #d4b366;
  --arany-melyebb: #8a6a1a;
  --vonal: #c9b88a;
}

body {
  font-family: 'EB Garamond', Georgia, serif;
  background: var(--kremes);
  color: var(--tinta);
  font-size: 16px;
  line-height: 1.6;
  min-height: 100vh;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(184, 146, 58, 0.04) 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(58, 90, 122, 0.04) 0%, transparent 50%);
}

/* === FEJLÉC === */
.fejlec {
  background: linear-gradient(180deg, #1a1f2e 0%, #2a2f3e 100%);
  color: var(--kremes);
  padding: 48px 32px 56px;
  position: relative;
  overflow: hidden;
}
.fejlec::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 4px;
  background: linear-gradient(90deg, var(--arany-melyebb), var(--arany), var(--arany-melyebb));
}
.fejlec::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 1px;
  background: var(--arany);
  opacity: 0.4;
}
.fejlec-belso { max-width: 920px; margin: 0 auto; }
.fejlec-kategoria {
  font-family: 'Inter', sans-serif;
  font-size: 11px;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: var(--arany-vilagos);
  margin-bottom: 14px;
  font-weight: 500;
}
.fejlec h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 38px;
  font-weight: 500;
  line-height: 1.15;
  margin-bottom: 12px;
  letter-spacing: -0.5px;
}
.fejlec h1 em {
  font-style: italic;
  color: var(--arany-vilagos);
  font-weight: 400;
}
.fejlec-alcim {
  font-family: 'EB Garamond', serif;
  font-size: 16px;
  color: #c5beac;
  font-style: italic;
  margin-bottom: 28px;
}
.fejlec-stat {
  display: flex; gap: 32px; flex-wrap: wrap;
  padding-top: 20px;
  border-top: 1px solid rgba(184, 146, 58, 0.25);
}
.stat-elem { font-family: 'Inter', sans-serif; }
.stat-szam {
  font-family: 'Cormorant Garamond', serif;
  font-size: 28px;
  font-weight: 600;
  color: var(--arany-vilagos);
  line-height: 1;
}
.stat-felirat {
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #9b9484;
  margin-top: 4px;
}

/* === NAVIGÁCIÓ === */
.nav-wrapper {
  background: var(--kremes-melyebb);
  border-bottom: 1px solid var(--vonal);
  position: sticky; top: 0; z-index: 30;
  box-shadow: 0 4px 20px rgba(26, 31, 46, 0.06);
}
.nav-belso {
  max-width: 920px; margin: 0 auto;
  padding: 14px 24px 10px;
  display: flex; flex-wrap: wrap; gap: 6px;
  justify-content: flex-start;
}
.nap-nav {
  background: var(--kremes);
  border-top: 1px dashed var(--vonal);
  padding: 10px 24px 12px;
  max-width: 920px;
  margin: 0 auto;
  display: flex; flex-wrap: wrap; gap: 5px;
}
.nap-nav-cim {
  font-family: 'Inter', sans-serif;
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--tinta-halvany);
  width: 100%;
  margin-bottom: 4px;
}
.nap-gomb {
  border: 1px solid var(--vonal);
  background: #fff;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  font-size: 10px;
  font-weight: 500;
  color: var(--tinta-vilagos);
  padding: 5px 9px;
  border-radius: 14px;
  transition: all 0.2s ease;
  letter-spacing: 0.3px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.nap-gomb:hover {
  border-color: var(--gomb-szin, var(--arany));
  background: var(--gomb-bg, var(--pergamen));
  color: var(--tinta);
  transform: translateY(-1px);
}
.nap-gomb-pont {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--gomb-szin, var(--arany));
  flex-shrink: 0;
}
.nap-gomb.szombat { --gomb-szin: #b8923a; --gomb-bg: #f9f1d8; }
.nap-gomb.unnep { --gomb-szin: #b85a3a; --gomb-bg: #f5e0d8; }
.nap-gomb.vizsga {
  --gomb-szin: var(--arany);
  background: var(--tinta);
  color: var(--kremes);
  font-weight: 600;
  border-color: var(--tinta);
}
.nap-gomb.vizsga:hover { background: var(--tinta); color: var(--arany-vilagos); }
.nap-gomb-mod1 { --gomb-szin: #2c4a6b; --gomb-bg: #e8eef5; }
.nap-gomb-mod2 { --gomb-szin: #3a6a4a; --gomb-bg: #e8f1ea; }
.nap-gomb-mod3 { --gomb-szin: #8a5a2a; --gomb-bg: #f5edd8; }
.nap-gomb-mod4 { --gomb-szin: #5a3a6b; --gomb-bg: #eee5f0; }
.nap-gomb-mod5 { --gomb-szin: #2a3a6b; --gomb-bg: #e6eaf5; }
.nap-gomb-mod0 { --gomb-szin: #5a5a4a; --gomb-bg: #ededdf; }

/* Highlight ha megnyitva */
.nap.highlighted {
  animation: villan 1.4s ease;
}
@keyframes villan {
  0% { box-shadow: 0 0 0 3px var(--arany); }
  100% { box-shadow: 0 6px 20px rgba(26, 31, 46, 0.08); }
}

.nav-gomb {
  border: 1px solid var(--vonal);
  background: var(--kremes);
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  font-size: 11px;
  font-weight: 500;
  color: var(--tinta-vilagos);
  padding: 8px 14px;
  border-radius: 22px;
  white-space: nowrap;
  transition: all 0.25s ease;
  letter-spacing: 0.3px;
}
.nav-gomb:hover {
  background: var(--pergamen);
  border-color: var(--arany);
  color: var(--tinta);
}
.nav-gomb.on {
  background: var(--tinta);
  border-color: var(--tinta);
  color: var(--kremes);
  box-shadow: 0 2px 8px rgba(26, 31, 46, 0.2);
}
.nav-gomb.on::before {
  content: '◆';
  margin-right: 5px;
  color: var(--arany-vilagos);
}

/* === FŐ TARTALOM === */
.fo {
  max-width: 920px; margin: 0 auto;
  padding: 32px 24px 60px;
}

/* === HETI FEJLÉC === */
.het-fejlec {
  display: flex;
  align-items: baseline;
  gap: 20px;
  margin: 36px 0 24px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--vonal);
  position: relative;
}
.het-fejlec::before {
  content: '';
  position: absolute;
  bottom: -1px; left: 0;
  width: 60px;
  height: 2px;
  background: var(--arany);
}
.het-szam-nagy {
  font-family: 'Cormorant Garamond', serif;
  font-size: 56px;
  font-weight: 500;
  color: var(--arany);
  line-height: 0.9;
  font-style: italic;
}
.het-info { flex: 1; padding-top: 10px; }
.het-cim {
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px;
  color: var(--tinta);
  font-weight: 500;
  margin-bottom: 4px;
}
.het-datum {
  font-family: 'Inter', sans-serif;
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--tinta-halvany);
}

/* === NAP KÁRTYA === */
.nap {
  background: #ffffff;
  border: 1px solid var(--vonal);
  border-radius: 4px;
  margin-bottom: 12px;
  overflow: hidden;
  transition: all 0.3s ease;
  position: relative;
}
.nap:hover {
  box-shadow: 0 6px 20px rgba(26, 31, 46, 0.08);
  transform: translateY(-1px);
}
.nap.nyitva { box-shadow: 0 8px 28px rgba(26, 31, 46, 0.1); }
.nap::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--szin, var(--arany));
}

.nap-fej {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 16px 20px 16px 22px;
  cursor: default;
}
.nap-fej.kattintható { cursor: pointer; }
.nap-fej.kattintható:hover .nap-tema { color: var(--szin, var(--tinta)); }

.nap-datum-blokk {
  flex-shrink: 0;
  text-align: center;
  width: 64px;
  padding: 6px 0;
  border-right: 1px solid var(--pergamen);
  padding-right: 14px;
}
.nap-honap {
  font-family: 'Inter', sans-serif;
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--tinta-halvany);
  margin-bottom: 2px;
}
.nap-szam {
  font-family: 'Cormorant Garamond', serif;
  font-size: 26px;
  font-weight: 600;
  color: var(--szin, var(--tinta));
  line-height: 1;
}
.nap-honap-nev {
  font-family: 'Inter', sans-serif;
  font-size: 9px;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--tinta-halvany);
  margin-top: 3px;
}

.nap-info {
  flex: 1;
  min-width: 0;
}
.nap-tipus-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 4px;
  flex-wrap: wrap;
}
.nap-hosszu {
  font-family: 'Inter', sans-serif;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.5px;
  color: #8a5a2a;
  background: rgba(184, 146, 58, 0.16);
  border: 1px solid rgba(184, 146, 58, 0.4);
  padding: 2px 8px;
  border-radius: 3px;
  white-space: nowrap;
}
.nap-hetnev {
  font-family: 'Inter', sans-serif;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--szin, var(--arany-melyebb));
}
.tipus-pill {
  font-family: 'Inter', sans-serif;
  font-size: 9px;
  letter-spacing: 1px;
  text-transform: uppercase;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 10px;
  background: var(--szin-vil, var(--pergamen));
  color: var(--szin, var(--arany-melyebb));
  border: 1px solid var(--szin-bor, var(--vonal));
}
.nap-stat {
  font-family: 'Inter', sans-serif;
  font-size: 10px;
  color: var(--tinta-halvany);
  letter-spacing: 0.5px;
}
.nap-tema {
  font-family: 'Cormorant Garamond', serif;
  font-size: 18px;
  font-weight: 500;
  color: var(--tinta);
  line-height: 1.35;
  transition: color 0.2s;
  margin-bottom: 8px;
}


.nap-nyil {
  flex-shrink: 0;
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--vonal);
  border-radius: 50%;
  color: var(--tinta-vilagos);
  font-size: 11px;
  transition: all 0.3s;
}
.nap.nyitva .nap-nyil {
  background: var(--tinta);
  border-color: var(--tinta);
  color: var(--kremes);
  transform: rotate(180deg);
}

/* === KIBONTOTT TARTALOM === */
.nap-body {
  display: none;
  border-top: 1px solid var(--pergamen);
  background: linear-gradient(180deg, #fdfaf3 0%, #ffffff 100%);
}

.tetel {
  padding: 18px 22px;
  border-bottom: 1px solid var(--pergamen);
}
.tetel:last-child { border-bottom: none; }

.tetel-fej {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 1px dashed var(--vonal);
}
.tetel-kod {
  font-family: 'Inter', sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.5px;
  padding: 4px 10px;
  background: var(--szin, var(--tinta));
  color: #fff;
  border-radius: 3px;
}
.tetel-cim {
  font-family: 'Cormorant Garamond', serif;
  font-size: 17px;
  font-weight: 500;
  color: var(--szin, var(--tinta));
  flex: 1;
  line-height: 1.3;
}

/* === KÉRDÉSEK === */
.kerdes-csoport {
  margin-bottom: 14px;
}
.kerdes-csoport:last-child { margin-bottom: 0; }

.csoport-cim {
  font-family: 'Inter', sans-serif;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--csop-szin);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.csoport-cim::before {
  content: '';
  width: 16px; height: 1px;
  background: var(--csop-szin);
}
.csoport-cim::after {
  content: '';
  flex: 1; height: 1px;
  background: var(--csop-szin);
  opacity: 0.2;
}

.kerdes {
  display: flex;
  gap: 12px;
  padding: 8px 0;
  align-items: flex-start;
  font-size: 14px;
  line-height: 1.55;
}
.kerdes-jelolo {
  flex-shrink: 0;
  width: 28px;
  text-align: center;
  padding-top: 1px;
  font-family: 'Inter', sans-serif;
  font-size: 10px;
  font-weight: 700;
  color: var(--csop-szin);
}
.kerdes-szoveg {
  color: var(--tinta);
  font-family: 'EB Garamond', serif;
}
.kerdes.k15 .kerdes-szoveg {
  font-weight: 600;
  font-size: 15px;
}

/* Csoport színváltozók */
.k15-csop { --csop-szin: var(--szin); }
.k10-csop { --csop-szin: var(--szin); opacity: 0.95; }
.k5-csop { --csop-szin: var(--szin-vilagos, var(--szin)); }

/* === SPECIÁLIS NAPOK === */
.nap.szombat::before { background: var(--arany); }
.nap.szombat .nap-szam { color: var(--arany-melyebb); }
.nap.unnep::before { background: #b85a3a; }
.nap.vizsga {
  background: linear-gradient(135deg, #1a1f2e 0%, #2a2f3e 100%);
  color: var(--kremes);
}
.nap.vizsga::before { background: var(--arany); }
.nap.vizsga .nap-honap,
.nap.vizsga .nap-honap-nev,
.nap.vizsga .nap-stat { color: #9b9484; }
.nap.vizsga .nap-szam { color: var(--arany-vilagos); }
.nap.vizsga .nap-tema { color: var(--kremes); font-style: italic; font-size: 20px; }
.nap.vizsga .tipus-pill {
  background: var(--arany);
  color: var(--tinta);
  border-color: var(--arany);
}

/* === MODUL SZÍNEK === */
.m1 { --szin: #2c4a6b; --szin-vilagos: #5a7a9b; --szin-vil: #e8eef5; --szin-bor: #b8c6d6; }
.m2 { --szin: #3a6a4a; --szin-vilagos: #6a9a7a; --szin-vil: #e8f1ea; --szin-bor: #b8ceb8; }
.m3 { --szin: #8a5a2a; --szin-vilagos: #b8923a; --szin-vil: #f5edd8; --szin-bor: #d6c490; }
.m4 { --szin: #5a3a6b; --szin-vilagos: #8a6a9b; --szin-vil: #eee5f0; --szin-bor: #c8b5d0; }
.m5 { --szin: #2a3a6b; --szin-vilagos: #5a6a9b; --szin-vil: #e6eaf5; --szin-bor: #b5bbd6; }
.m0 { --szin: #5a5a4a; --szin-vilagos: #8a8a7a; --szin-vil: #ededdf; --szin-bor: #c8c5b5; }

/* ═══════════════ TANULÁSI TIPP ═══════════════ */
.tipp-panel {
  background: linear-gradient(180deg, #fdfaf3 0%, #ffffff 100%);
  border: 1px solid var(--vonal);
  border-left: 4px solid var(--arany);
  border-radius: 3px;
  margin: 4px 0 16px;
  overflow: hidden;
}
.tipp-fej {
  padding: 11px 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 9px;
  user-select: none;
  background: rgba(184, 146, 58, 0.06);
}
.tipp-fej:hover { background: rgba(184, 146, 58, 0.12); }
.tipp-fej-cim {
  font-family: 'Inter', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--arany-melyebb);
  flex: 1;
}
.tipp-fej-nyil { color: var(--arany); font-size: 11px; transition: transform 0.2s; }
.tipp-panel.nyitva .tipp-fej-nyil { transform: rotate(180deg); }
.tipp-body { display: none; padding: 4px 18px 16px; }
.tipp-panel.nyitva .tipp-body { display: block; }
.tipp-napi {
  font-family: 'EB Garamond', serif;
  font-size: 14.5px;
  line-height: 1.55;
  color: var(--tinta);
  background: #ffffff;
  border: 1px solid var(--pergamen);
  border-radius: 3px;
  padding: 11px 14px;
  margin: 8px 0 14px;
}
.tipp-napi strong { color: var(--kek); font-weight: 600; }

.tipp-napi p { margin: 0 0 10px; }
.tipp-napi p:last-child { margin-bottom: 0; }
.tipp-tetel {
  margin: 9px 0;
  padding: 9px 12px;
  background: #fdfaf3;
  border: 1px solid var(--pergamen);
  border-radius: 3px;
  font-size: 14px;
  line-height: 1.5;
}
.tipp-tetel-kod {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-weight: 600;
  color: var(--arany-melyebb);
  font-size: 16px;
}
.tipp-figyelj {
  margin-top: 10px;
  padding: 9px 12px;
  background: rgba(184, 146, 58, 0.1);
  border-left: 3px solid var(--arany);
  border-radius: 0 2px 2px 0;
  font-size: 13.5px;
  line-height: 1.5;
  font-style: italic;
}
.tipp-figyelj strong { font-style: normal; color: var(--kek); }
.tipp-napi { }

.tipp-szakasz-cim {
  font-family: 'Inter', sans-serif;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--arany-melyebb);
  margin: 0 0 8px;
  display: flex; align-items: center; gap: 8px;
}
.tipp-szakasz-cim::before { content:''; width:12px; height:1px; background: var(--arany); }
.tipp-lepesek { list-style: none; padding: 0; counter-reset: tl; }
.tipp-lepesek li {
  position: relative;
  padding: 7px 0 7px 42px;
  border-bottom: 1px dashed var(--pergamen);
  font-family: 'EB Garamond', serif;
  font-size: 14px;
  line-height: 1.5;
  counter-increment: tl;
}
.tipp-lepesek li:last-child { border-bottom: none; }
.tipp-lepesek li::before {
  content: counter(tl);
  position: absolute; left: 0; top: 7px;
  width: 26px; height: 26px;
  background: var(--kek); color: var(--kremes);
  font-family: 'Inter', sans-serif; font-weight: 700; font-size: 12px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
}
.tipp-lepes-cim { font-weight: 600; color: var(--tinta); }
.tipp-ido {
  font-family: 'Inter', sans-serif; font-size: 10px;
  color: var(--arany-melyebb); font-weight: 600;
  margin-left: 6px;
}
.tipp-lab {
  margin-top: 12px; font-style: italic; font-size: 13px;
  color: var(--tinta-vilagos);
  padding: 8px 12px; background: #fdfaf3;
  border-left: 3px solid var(--arany-vil); border-radius: 0 2px 2px 0;
}

/* ═══════════════ ÖSSZEFOGLALÓ ═══════════════ */
.os-bevez {
  background: linear-gradient(135deg, #1a1f2e 0%, #2a2f3e 100%);
  color: var(--kremes);
  padding: 18px 22px;
  margin: 4px 0 18px;
  border-radius: 3px;
  text-align: center;
  border-left: 4px solid var(--arany);
}
.os-bevez-katlb {
  font-family: 'Inter', sans-serif;
  font-size: 9px;
  letter-spacing: 3px;
  text-transform: uppercase;

OSSZEF.h1='<div class="os-bevez"><div class="os-bevez-katlb">Szombati Ismétlés · 1. Hét</div><div class="os-bevez-cim">Államigazgatás — Összefoglaló</div><div class="os-bevez-alcim">Alkotmányos alapok és szervezetrendszer · Á/1—Á/11.</div></div><article class="os-tetel"><div class="os-tetel-fej"><div class="os-tetel-kod">Á/1.</div><div class="os-tetel-cim">A hatalommegosztás átalakulása</div></div><div class="os-tetel-body"><div class="os-szek"><div class="os-szek-cim">A klasszikus elmélet</div><ul class="os-lista"><li><span class="os-kulcs">Montesquieu</span> (A törvények szelleméről): a három hatalmi ág — <span class="os-kulcs">törvényhozó, végrehajtó, bírói</span> — személyileg és szervezetileg is elkülönül</li><li>Cél: a <span class="os-tul">zsarnokság kiküszöbölése</span>, a törvények uralmának biztosítása</li><li><span class="os-kulcs">Kölcsönös függőség és ellenőrzés</span> — fékek és ellensúlyok</li></ul></div><div class="os-szek"><div class="os-szek-cim">A hatalommegosztás 3 alapvető formája</div><ol class="os-szam"><li><span class="os-kulcs">Klasszikus</span> — leginkább az amerikai prezidenciális (elnöki) rendszerben</li><li><span class="os-kulcs">Kétkamarás törvényhozás</span> — alsó-/felsőház (Mo. egykamarás!)</li><li><span class="os-kulcs">Föderalizmus</span> — szövetségi és tartományi szint (USA, Németország, Ausztria, Svájc)</li></ol></div><div class="os-szek"><div class="os-szek-cim">Az átalakulás okai</div><ul class="os-lista"><li>Montesquieu az <span class="os-kulcs">alkotmányos monarchiára</span> alkotta meg elméletét — köztársasági és modern parlamentáris rendszerben nehezen alkalmazható</li><li>Modern parlamentáris rendszerben (Mo. 1989 óta): a törvényhozás <span class="os-tul">nem ellensúlya, hanem partnere</span> a végrehajtó hatalomnak</li><li>Az egyensúlyt <span class="os-kulcs">semleges/független szervek</span> biztosítják: ÁSZ, ombudsman, Alkotmánybíróság</li></ul></div><div class="os-szek"><div class="os-szek-cim">Történeti előzmények, elméletek</div><ul class="os-lista"><li><span class="os-kulcs">Arisztotelész</span> (Politika) → középkor (világi-egyházi hatalom) → <span class="os-kulcs">John Locke</span> (törvényhozó, végrehajtó, föderatív) → <span class="os-kulcs">Montesquieu</span></li><li><span class="os-ev">1787</span> az USA alkotmánya</li><li><span class="os-kulcs">Benjamin Constant</span>: az <span class="os-tul">államfői hatalom</span> (semleges hatalom) teremti meg az egyensúlyt a hatalmi ágak között</li><li>Hatalommegosztást <span class="os-kulcs">elutasító</span> elméletek: fejedelmi szuverenitás (Laband), népszuverenitás (Rousseau), államhatalom egysége (marxista)</li></ul></div><div class="os-szek"><div class="os-szek-cim">10 pontos kérdések</div><ul class="os-lista"><li><strong>1.</strong> A hatalommegosztás klasszikus elmélete — Arisztotelész → Locke (törvényhozó, végrehajtó, föderatív) → <span class="os-kulcs">Montesquieu</span> („A törvények szelleméről"): <span class="os-kulcs">törvényhozó, végrehajtó, bírói</span> hatalom; személyileg-szervezetileg elkülönülnek és ellensúlyozzák egymást — cél a zsarnokság kiküszöbölése, a szabadság biztosítása.</li><li><strong>2.</strong> A fékek és ellensúlyok rendszere — a hatalmi ágak <span class="os-kulcs">egymást ellenőrzik, fékezik</span> (checks and balances); egyik ág sem vonhatja el a másik jogosítványait. A hatalom nem korlátlan — kölcsönös függés és ellensúly.</li><li><strong>3.</strong> Az igazgatási hatalom elmélete — a XIX. sz. vége–XX. sz. eleje, a közigazgatás túlterjeszkedésére adott válasz; <span class="os-kulcs">negyedik hatalmi ágként</span>. Az USA-ban: a Kongresszus által létrehozott, az elnöki adminisztrációtól független „nagy közigazgatási bizottságok" testesítik meg.</li></ul></div></div></article><article class="os-tetel"><div class="os-tetel-fej"><div class="os-tetel-kod">Á/2.</div><div class="os-tetel-cim">Az Országgyűlés és a Kormány viszonya</div></div><div class="os-tetel-body"><div class="os-szek"><div class="os-szek-cim">A kormányforma</div><ul class="os-lista"><li>Magyarország kormányformája: <span class="os-kulcs">parlamentáris köztársaság</span></li><li>A végrehajtó hatalom a törvényhozástól nyeri megbízatását; feltétele, hogy a Kormány <span class="os-tul">bírja a törvényhozás bizalmát</span></li><li><span class="os-kulcs">Alaptörvény 15. cikk (1)</span>: a végrehajtó hatalom általános szerve a Kormány, amely az Ogynek felelős</li></ul></div><div class="os-szek"><div class="os-szek-cim">Bizalmi viszony</div><ul class="os-lista"><li>A miniszterelnököt — a K.eln. javaslatára — az <span class="os-kulcs">Ogy választja</span></li><li><span class="os-kulcs">Konstruktív bizalmatlanság</span>: a miniszterelnökkel szemben, egyidejűleg új miniszterelnök választásával</li><li><span class="os-kulcs">Bizalmi szavazás</span>: a miniszterelnök indítványozhatja; ha a képviselők több mint fele nem támogatja → megszűnik a megbízatása</li><li>A miniszterek kinevezésébe az Ogy beleszólása <span class="os-tul">formális</span> (bizottsági meghallgatás, de nem kötelező; csak elmaradása akadály)</li></ul></div><div class="os-szek"><div class="os-szek-cim">Az Ogy ellenőrző tevékenysége</div><ul class="os-lista"><li><span class="os-kulcs">Ellenőrzés</span> — önálló alkotmányos funkció (plénum + bizottságok)</li><li><span class="os-kulcs">Politikai vitanap</span> — indítványtól számított <span class="os-tul">14-28 nap</span> között</li><li><span class="os-kulcs">Beszámolók, jelentések</span></li><li><span class="os-kulcs">Interpelláció</span> — Kormányhoz/tagjához, <span class="os-tul">viszontválasz van</span></li><li><span class="os-kulcs">Kérdés</span> — Kormányhoz, ombudsmanhoz, legfőbb ügyészhez, ÁSZ-/MNB-elnökhöz, <span class="os-tul">nincs viszontválasz</span></li></ul></div><div class="os-megj">💡 A Kormány <span class="os-kulcs">nem oszlathatja fel az Ogyt</span>, és nincs törvényalkotási vétója.</div></div></article><article class="os-tetel"><div class="os-tetel-fej"><div class="os-tetel-kod">Á/3.</div><div class="os-tetel-cim">A köztársasági elnök és a Kormány viszonya</div></div><div class="os-tetel-body"><div class="os-szek"><div class="os-szek-cim">Az államfő alkotmányos helye</div><ul class="os-lista"><li><span class="os-kulcs">Magyarország államfője</span>, kifejezi a nemzet egységét, őrködik az államszervezet demokratikus működése felett (Alaptörvény 9. cikk)</li><li>Ogy választja <span class="os-tul">5 évre</span>, 35. életévét betöltött magyar állampolgár, <span class="os-tul">egyszer újraválasztható</span></li><li>NEM része a végrehajtó hatalomnak; semleges, egyensúlyozó szerep</li></ul></div><div class="os-szek"><div class="os-szek-cim">Ellenjegyzést NEM igénylő jogkörök</div><ul class="os-lista"><li>Képviseli Magyarországot; törvényt és népszavazást kezdeményezhet</li><li>Kitűzi a választás és népszavazás időpontját; összehívja az Ogy alakuló ülését</li><li><span class="os-kulcs">Feloszlathatja az Országgyűlést</span></li><li><span class="os-kulcs">Politikai és alkotmányos vétójog</span> (de ha az Ogy ismét elfogadja, alá kell írnia — <span class="os-tul">formális vétó</span>)</li><li>Kinevezi a hivatásos bírákat és a Költségvetési Tanács elnökét</li></ul></div><div class="os-szek"><div class="os-szek-cim">Az Ogy feloszlatásának esetei</div><ul class="os-lista"><li>A Kormány megbízatása megszűnik, és a javasolt személyt <span class="os-tul">40 napon belül</span> nem választják meg</li><li>Ha <span class="os-tul">március 31-ig</span> a költségvetést nem fogadják el (<span class="os-kulcs">indemnitás, ex lex állapot</span>)</li></ul></div><div class="os-szek"><div class="os-szek-cim">Ellenjegyzéshez kötött jogkörök</div><ul class="os-lista"><li>Nemzetközi szerződések; nagykövetek megbízása-fogadása</li><li>Miniszterek, MNB-elnök, önálló szabályozó szerv vezetője, egyetemi tanárok kinevezése</li><li>Tábornokok kinevezése-előléptetése; kitüntetések; <span class="os-kulcs">egyéni kegyelem</span></li></ul></div><div class="os-szek"><div class="os-szek-cim">10 pontos kérdések</div><ul class="os-lista"><li><strong>12.</strong> Területszervezési döntések (Ogy / köztárs. elnök) — <span class="os-kulcs">Országgyűlés</span>: az állam területi tagozódása, a vármegyék összevonása-szétválasztása-elnevezése-székhelye, fővárosi kerületek. <span class="os-kulcs">Köztársasági elnök</span>: városi cím, község alakítása-egyesítése, város/község elnevezése (a Kormány előkészíti; K.eln. döntéséhez ellenjegyzés kell).</li></ul></div></div></article><article class="os-tetel"><div class="os-tetel-fej"><div class="os-tetel-kod">Á/4.</div><div class="os-tetel-cim">ÁSZ és az alapvető jogok biztosa — ellenőrzés</div></div><div class="os-tetel-body"><div class="os-szek"><div class="os-szek-cim">Közös: mindkettő az Országgyűlés ellenőrző szerve</div><div class="os-grid"><div><div class="alcim">Állami Számvevőszék</div><span class="os-kulcs">Pénzügyi és gazdasági</span> ellenőrzés; <span class="os-tul">valamennyi közigazgatási szerv gazdálkodása</span>; törvényesség + célszerűség + eredményesség</div><div><div class="alcim">Alapvető jogok biztosa</div><span class="os-kulcs">Alapjogvédelem</span>; hatáskör a <span class="os-tul">közigazgatás egészére</span> (kivéve Ogy, K.eln., AB, ÁSZ, bíróság, ügyészség)</div></div></div><div class="os-szek"><div class="os-szek-cim">Megbízatás</div><div class="os-grid"><div><div class="alcim">ÁSZ elnök</div>Ogy választja <span class="os-tul">12 évre</span>; az ÁSZ elnöke a Költségvetési Tanács tagja</div><div><div class="alcim">Ombudsman</div>Ogy választja a K.eln. javaslatára <span class="os-tul">6 évre</span> (helyetteseivel); eljárását <span class="os-kulcs">bárki kezdeményezheti</span></div></div></div><div class="os-szek"><div class="os-szek-cim">Eszközök</div><div class="os-grid"><div><div class="alcim">ÁSZ</div><span class="os-kulcs">Bírósághoz fordulhat</span>, nyilvánosságra hoz, <span class="os-kulcs">zárolhat</span>, felfüggesztheti a pénzeszközök felhasználását; akadályozása bűncselekmény</div><div><div class="alcim">Ombudsman</div><span class="os-kulcs">Érdemi intézkedési jogosultsága nincs</span>: ajánlás, bírósági/AB-eljárás kezdeményezése, nyilvánosság; 2021.01.01 óta egyenlő bánásmód ügyekben hatóságként jár el</div></div></div><div class="os-szek"><div class="os-szek-cim">10 pontos kérdések</div><ul class="os-lista"><li><strong>5.</strong> Az igazságszolgáltatás és az államigazgatás viszonya — a bíróság <span class="os-kulcs">független</span> a végrehajtó hatalomtól; dönt a <span class="os-kulcs">közigazgatási határozatok törvényességéről</span>, az önkormányzati rendelet más jogszabályba ütközéséről, a jogalkotási mulasztásról. Közigazgatási perben (Kp., 2017. évi I. tv.) megsemmisíti/megváltoztatja a jogsértő döntést.</li><li><strong>6.</strong> Az ügyészség és az államigazgatás viszonya — az ügyészség az <span class="os-kulcs">Országgyűlésnek alárendelt</span> (nem a kormánynak); a közérdek védelmében <span class="os-kulcs">ellenőrzi a hatósági döntések törvényességét</span>, fellép, hatósági eljárást kezdeményez, jogorvoslatot terjeszt elő, önkéntes teljesítésre hív fel.</li></ul></div><div class="os-szek"><div class="os-szek-cim">5 pontos kérdések</div><ul class="os-lista"><li><strong>2.</strong> Az utólagos normakontroll — a jogalkotó államigazgatási szervek <span class="os-kulcs">normatív aktusai</span> (rendelet, normatív határozat/utasítás) az <span class="os-kulcs">Alkotmánybíróság</span> előtt megtámadhatók. Önkormányzati rendelet: Alaptörvénybe ütközés → AB; más jogszabályba ütközés → <span class="os-kulcs">Kúria</span>.</li><li><strong>3.</strong> Az alapvető jogok biztosa és eszközei — <span class="os-kulcs">ombudsman</span>; alapjogvédelem, eljárását <span class="os-kulcs">bárki kezdeményezheti</span>, az Ogy választja. <span class="os-kulcs">Érdemi intézkedési joga nincs</span>: ajánlás, bírósági/AB-eljárás kezdeményezése, nyilvánosság.</li><li><strong>4.</strong> Az Állami Számvevőszék és eszközei — az Ogy pénzügyi-gazdasági ellenőrző szerve; valamennyi közigazgatási szerv gazdálkodását ellenőrzi. Eszközök: bírósághoz fordulhat, nyilvánosságra hoz, <span class="os-kulcs">zárolhat</span>, felfüggesztheti a pénzeszközök felhasználását; akadályozása bűncselekmény.</li></ul></div></div></article><article class="os-tetel"><div class="os-tetel-fej"><div class="os-tetel-kod">Á/5.</div><div class="os-tetel-cim">A magyar közigazgatás alrendszerei</div></div><div class="os-tetel-body"><div class="os-szek"><div class="os-szek-cim">Két alrendszer</div><ul class="os-lista"><li><span class="os-kulcs">Államigazgatási szervek</span> — az országos jelentőségű (össztársadalmi) ügyek intézése; az állam felel értük</li><li><span class="os-kulcs">Helyi önkormányzatok</span> — a helyi közügyek; a választott, közhatalommal felruházott helyi szervek felelnek értük</li></ul></div><div class="os-szek"><div class="os-szek-cim">Közös tulajdonságok</div><ul class="os-lista"><li>Feladataikat <span class="os-kulcs">jogszabályok</span> határozzák meg</li><li><span class="os-kulcs">Közfeladatok</span> ellátására hivatottak, <span class="os-kulcs">közpénzből</span> működnek, tulajdonuk <span class="os-kulcs">köztulajdon</span></li></ul></div><div class="os-szek"><div class="os-szek-cim">Kapcsolódási pontok</div><ol class="os-szam"><li><span class="os-kulcs">Törvényességi felügyelet</span> — a Kormány (KTM irányításával, korm.hivatalok útján) biztosítja az önkormányzatok jogszerű működését</li><li><span class="os-kulcs">Államigazgatási (delegált) feladatok</span> — önkormányzati szervek látják el; e körben utasítás nem adható, felül nem bírálható</li><li><span class="os-kulcs">Területszervezési döntések</span> — részben Ogy (megyék, főváros), részben K.eln. (város, község)</li><li><span class="os-kulcs">Véleményezési és javaslattételi jog</span> — megkeresésre <span class="os-tul">30 napon belül</span> érdemi válasz (8 napon belül áttétel, ha nem hatáskör)</li></ol></div><div class="os-szek"><div class="os-szek-cim">5 pontos kérdések</div><ul class="os-lista"><li><strong>1.</strong> A municipiális hatalom — a helyi <span class="os-kulcs">önkormányzatiság mint önálló hatalmi tényező</span> (Benjamin Constant; Mo.-on 1848, Eötvös József). A végrehajtó hatalom dominanciájának megtörése a hatalom széttöredezésével.</li><li><strong>5.</strong> A véleményezési és javaslattételi jog — a helyi önkormányzat a feladat-/hatáskörrel rendelkező szervtől <span class="os-kulcs">tájékoztatást kérhet, döntést kezdeményezhet, véleményt nyilváníthat</span>; a megkeresett szerv <span class="os-ev">30 napon belül</span> érdemben válaszol (8 napon belül átteszi, ha nem hatásköre).</li><li><strong>6.</strong> Az alrendszerek kapcsolódási pontjai — közpénzből működnek; <span class="os-kulcs">törvényességi felügyelet</span> (legjelentősebb), átruházott államigazgatási feladatok, <span class="os-kulcs">területszervezés</span>, véleményezési-javaslattételi jog.</li><li><strong>7.</strong> A tutela (állami gyámkodás) — a központi államigazgatás és a korlátozott autonómiájú önkormányzat közötti <span class="os-kulcs">szigorú, célszerűségi és előzetes felügyelet</span>. A modern rendszerekben helyette <span class="os-kulcs">utólagos, törvényességi</span> felügyelet van.</li></ul></div></div></article><article class="os-tetel"><div class="os-tetel-fej"><div class="os-tetel-kod">Á/6.</div><div class="os-tetel-cim">Decentralizált és dekoncentrált szervek</div></div><div class="os-tetel-body"><div class="os-szek"><div class="os-szek-cim">Kiindulás: centralizáció vs. decentralizáció</div><ul class="os-lista"><li>Államszervezési elvek; két követelmény: a közigazgatás <span class="os-kulcs">egysége</span> + <span class="os-kulcs">alkalmazkodás</span> a helyi sajátosságokhoz</li><li><span class="os-kulcs">Centralizáció</span>: egy helyre összpontosul az irányítás → mereven hierarchikus, önmagában működésképtelen</li><li><span class="os-kulcs">Dekoncentráció</span>: a centralizáció kiegészítése — helyi jelentőségű ügyekben döntési jog a központ kinevezett hivatalnokainak</li></ul></div><div class="os-szek"><div class="os-szek-cim">Dekoncentrált szervek</div><ul class="os-lista"><li><span class="os-kulcs">Centralizált</span> rendszer része; a központi szerv helyi kirendeltsége</li><li>Döntéseiket <span class="os-tul">állami hivatalnokok</span> hozzák az állam nevében; vezetőit a felettes szerv nevezi ki</li><li>Hierarchikus alárendeltség; személyi állomány: <span class="os-kulcs">kormánytisztviselő</span></li></ul></div><div class="os-szek"><div class="os-szek-cim">Decentralizált szervek</div><ul class="os-lista"><li>Jogilag és szervezetileg <span class="os-kulcs">önállóan</span> működő szervek látnak el közfeladatot, autonómia birtokában</li><li><span class="os-kulcs">Területi decentralizáció</span> → helyi önkormányzat · <span class="os-kulcs">funkcionális decentralizáció</span> → kórház, iskola, posta</li><li>Választott vezetők; nincs hierarchikus felettes; személyi állomány: <span class="os-kulcs">köztisztviselő</span></li></ul></div><div class="os-szek"><div class="os-szek-cim">Közös sajátosság</div><ul class="os-lista"><li>Céljuk azonos: <span class="os-kulcs">közelebb hozni a közigazgatást</span> az igazgatottakhoz, érvényesíteni a helyi sajátosságokat, hatékonyabbá tenni a működést</li></ul></div><div class="os-szek"><div class="os-szek-cim">10 pontos kérdések</div><ul class="os-lista"><li><strong>9.</strong> A decentralizáció előnyei és hátrányai — <span class="os-kulcs">Előnyök</span>: önigazgatás, közvetítő közeg a központ és az igazgatottak között, munkamegosztás, a feladatot a leghatékonyabban ellátóra bízzák. <span class="os-kulcs">Hátrányok</span>: erősíti a partikularizmust, gyengítheti a nemzeti egységet, helyi érdekcsoportok befolyása, szakértelem hiánya.</li></ul></div><div class="os-szek"><div class="os-szek-cim">5 pontos kérdések</div><ul class="os-lista"><li><strong>10.</strong> A centralizáció előnyei és hátrányai — az állam minden feladatot magára vállal; az <span class="os-kulcs">abszolút centralizáció működésképtelen</span> → kiegészül a dekoncentrációval. <span class="os-kulcs">Előny</span>: gyengíti a partikularizmust, erősíti a nemzeti egységet, megakadályozza a helyi érdekcsoportok befolyását.</li></ul></div></div></article><article class="os-tetel"><div class="os-tetel-fej"><div class="os-tetel-kod">Á/7.</div><div class="os-tetel-cim">Az államigazgatási szervek csoportosítása</div></div><div class="os-tetel-body"><div class="os-szek"><div class="os-szek-cim">Tipikus államigazgatási szervek</div><ul class="os-lista"><li><span class="os-kulcs">Kormány</span> — általános hatáskörű csúcsszerv</li><li><span class="os-kulcs">Minisztériumok</span>, <span class="os-kulcs">Miniszterelnökség, Miniszterelnöki Kormányiroda</span></li><li><span class="os-kulcs">Központi hivatalok</span> — miniszter irányítása alatt</li><li><span class="os-kulcs">Kormányzati főhivatalok</span> — a Kormány irányítása alatt, Ksztv./Kit. nevesíti</li><li><span class="os-kulcs">Területi szervek</span> — fővárosi és vármegyei kormányhivatalok, járási hivatalok</li></ul></div><div class="os-szek"><div class="os-szek-cim">Atipikus szervek</div><ul class="os-lista"><li><span class="os-kulcs">Autonóm államigazgatási szervek</span> — pl. KEHI, GVH, NAV nem; függetlenebbek</li><li><span class="os-kulcs">Önálló szabályozó szervek</span> — pl. NMHH, MEKH, SZTFH (rendeletalkotási joggal)</li></ul></div><div class="os-szek"><div class="os-szek-cim">Az elhatárolás egyik alapja: civil vs. rendészeti</div><div class="os-grid"><div><div class="alcim">Civil államigazgatási szerv</div>Dolgozóik <span class="os-kulcs">kormánytisztviselők/köztisztviselők</span></div><div><div class="alcim">Rendészeti (rendvédelmi) szerv</div><span class="os-kulcs">Hivatásos szolgálati jogviszony</span>; rendőrség, BV, katasztrófavédelem, nemzetbiztonsági szolgálatok (Ksztv.); 2019-től rendvédelmi igazgatási alkalmazotti jogviszony</div></div></div><div class="os-szek"><div class="os-szek-cim">10 pontos kérdések</div><ul class="os-lista"><li><strong>10.</strong> Az államigazgatási szervek csoportosítása — <span class="os-kulcs">tipikus</span> (hierarchikus, kormány irányítása alatt) vs. <span class="os-kulcs">atipikus</span> (önálló szabályozó + autonóm); földrajzilag: központi / területi / helyi; vezetés: egyszemélyi / testületi; hatáskör: általános / különös; <span class="os-kulcs">civil / rendészeti</span>.</li><li><strong>19.</strong> Kormányzati főhivatal és központi hivatal — azonosságok — mindkettő <span class="os-kulcs">szakmai munkát</span> végez (politikai döntés-végrehajtás), egyszemélyi vezetés, vezetőjük nem miniszter (nincs önálló ágazatirányítás), kormányzati szolgálati jogviszonyú felsővezető, SZMSZ határozza meg a struktúrát.</li><li><strong>20.</strong> Kormányzati főhivatal és központi hivatal — különbségek — <span class="os-kulcs">Kormányzati főhivatal</span> (2 db, pl. KSH, SZTNH): csak <span class="os-kulcs">törvény</span> hozza létre, a Kit. tételesen felsorolja, a Kormány irányítja, feladatkörében nem utasítható. <span class="os-kulcs">Központi hivatal</span>: Kormány (rendelettel) vagy tv. hozza létre, miniszter irányítja, kormányrendelet határozza meg a hatáskörét.</li><li><strong>21.</strong> Az autonóm államigazgatási szervek — nagyfokú <span class="os-kulcs">önállóság</span>, nem a kormány irányítása alatt; főként hatósági jogalkalmazás, <span class="os-kulcs">politikai semlegesség</span>. Ogy hozza létre törvénnyel, Ogy ellenőrzi, nem utasíthatók, költségvetésüket a kormány nem csökkentheti. Pl. GVH, NAIH, NVI, Integritás Hatóság. <span class="os-kulcs">Rendeletalkotási joguk nincs</span>.</li><li><strong>25.</strong> Közintézeti és közüzemi szervek — közszolgáltatást ellátó intézeti típusú szervek. <span class="os-kulcs">Közintézet</span>: humán közszolgáltatás (oktatás, egészségügy, kultúra), ingyenes/közvetett finanszírozás, <span class="os-kulcs">közalkalmazottak</span>, költségvetési szerv. <span class="os-kulcs">Közüzem</span>: gazdasági közszolgáltatás piaci áron (közművek, tömegközlekedés), <span class="os-kulcs">munkaviszony</span>.</li></ul></div><div class="os-szek"><div class="os-szek-cim">5 pontos kérdések</div><ul class="os-lista"><li><strong>11.</strong> Az illetékesség — területi alapú <span class="os-kulcs">munkamegosztás</span> az államigazgatásban. Az illetékességi terület és az illetékességi okok (jogszabály határozza meg) együtt döntik el, az azonos hatáskörűek közül <span class="os-kulcs">melyik szerv</span> jár el (pl. ügyfél lakóhelye, ingatlan fekvése).</li><li><strong>25.</strong> A közszolgáltatások ellátásának formái — jellemzően nem maga az államigazgatási szerv látja el, hanem <span class="os-kulcs">intézeti típusú szervet</span> alapít: <span class="os-kulcs">közintézet</span> (közfeladatra létrejött jogi személy) és <span class="os-kulcs">közüzem</span> (alapvető szolgáltatások folyamatos biztosítása).</li><li><strong>27.</strong> Az ex lege szabályozási mód — a jogalanyokra <span class="os-kulcs">közvetlenül</span> ható szabályozási mód (szemben a hatósági jogalkalmazással, ahol egyedi aktussal érvényesítik a jogot); a jogalanyok <span class="os-kulcs">önkéntes jogkövetéssel</span> érvényesítik a normát. A hatósági felügyelet ehhez kötődik.</li><li><strong>28.</strong> Az intézeti típusú szerv — közszolgáltatás ellátására létrehozott szervtípus; két fajta: <span class="os-kulcs">közintézet</span> (humán, nem piaci ár) és <span class="os-kulcs">közüzem</span> (gazdasági, piaci ár). Az elhatárolás alapja a közszolgáltatás jellege (viszonylagos).</li></ul></div></div></article><article class="os-tetel"><div class="os-tetel-fej"><div class="os-tetel-kod">Á/8.</div><div class="os-tetel-cim">Az irányítás fogalma, eszközei, típusai</div></div><div class="os-tetel-body"><div class="os-szek"><div class="os-szek-cim">Fogalom</div><ul class="os-lista"><li>Az <span class="os-kulcs">irányítás, felügyelet, ellenőrzés</span> szervezetek közötti viszonyt írnak le</li><li>Aki irányít, <span class="os-tul">nem része</span> az irányított szervezetnek; az ellenőrzés mindkettő részjogosítványa</li><li>Az irányítás ad lehetőséget a <span class="os-kulcs">legintenzívebb és legteljesebb akaratérvényesítésre</span></li></ul></div><div class="os-szek"><div class="os-szek-cim">Eszközök (Ksztv./Kit.)</div><ul class="os-lista"><li>Szerv <span class="os-kulcs">alapítása, átalakítása, megszüntetése</span></li><li>Vezető <span class="os-kulcs">kinevezése, felmentése</span></li><li><span class="os-kulcs">Törvényességi, szakszerűségi, hatékonysági, pénzügyi ellenőrzés</span></li><li>SZMSZ jóváhagyása; döntés megsemmisítése; <span class="os-kulcs">egyedi utasítás</span>; jelentéstételre kötelezés</li></ul></div><div class="os-szek"><div class="os-szek-cim">Jellemzők</div><ul class="os-lista"><li>Az irányított <span class="os-kulcs">teljes szervezeti alárendeltségét</span> eredményezi</li><li><span class="os-tul">Nem korlátlan</span>, jogszabályt nem sérthet; legismertebb korlátja a <span class="os-kulcs">hatáskörelvonás tilalma</span></li></ul></div><div class="os-szek"><div class="os-szek-cim">Fajtái</div><ul class="os-lista"><li><span class="os-kulcs">Szakmai irányítás</span> — csak a szakmai tevékenységre</li><li><span class="os-kulcs">Szervezetirányítás</span> — a szervezeti működésre (nem szakmaspecifikus)</li><li><span class="os-kulcs">Teljes irányítás</span> = szakmai + szervezetirányítás</li></ul></div><div class="os-megj">💡 A <span class="os-kulcs">felügyelet</span> nem eredményez teljes szervezeti alárendeltséget — kevesebb rendelkezési joggal jár, mint az irányítás.</div><div class="os-szek"><div class="os-szek-cim">10 pontos kérdések</div><ul class="os-lista"><li><strong>11.</strong> Irányítás, felügyelet, ellenőrzés elhatárolása — szervek közötti viszony, eltérő <span class="os-kulcs">akaratérvényesítési erősséggel</span>. <span class="os-kulcs">Irányítás</span>: legintenzívebb, hierarchikus, eszköze a felügyelet és az ellenőrzés is. <span class="os-kulcs">Felügyelet</span>: nem teljes alárendeltség, korlátozott. <span class="os-kulcs">Ellenőrzés</span>: szervezeten belül is, az irányítás/felügyelet részjogosítványa.</li></ul></div><div class="os-szek"><div class="os-szek-cim">5 pontos kérdések</div><ul class="os-lista"><li><strong>14.</strong> Az irányítás fajtái (irányultság szerint) — <span class="os-kulcs">szakmai irányítás</span> (csak a szakmai tevékenységre, ágazatonként eltérő), <span class="os-kulcs">szervezetirányítás</span> (a szervezeti működésre, minden szervnél azonos), <span class="os-kulcs">teljes irányítás</span> (mindkettő, legszigorúbb).</li><li><strong>15.</strong> Irányítás és vezetés — az <span class="os-kulcs">irányítás szervek közötti</span> kapcsolat (az irányító nem része az irányítottnak); a <span class="os-kulcs">vezetés szervezeten belüli</span> (a vezető része a szervezetnek). Közös: hierarchikus viszony, az ellenőrzés mindkettő részjogosítványa.</li></ul></div></div></article><article class="os-tetel"><div class="os-tetel-fej"><div class="os-tetel-kod">Á/9.</div><div class="os-tetel-cim">A Kormány fogalma, funkciói, összetétele</div></div><div class="os-tetel-body"><div class="os-szek"><div class="os-szek-cim">Fogalom</div><ul class="os-lista"><li>Az <span class="os-kulcs">államigazgatás általános hatáskörű szerve</span>; az Alaptörvény szerint a <span class="os-kulcs">végrehajtó hatalom általános szerve</span></li></ul></div><div class="os-szek"><div class="os-szek-cim">Kettős funkció</div><ul class="os-lista"><li><span class="os-kulcs">Kormányzati tevékenység</span> — középpontban a politikai döntések</li><li><span class="os-kulcs">Közigazgatási (államigazgatási) feladatok</span> — a politikai döntések előkészítése, végrehajtása</li></ul></div><div class="os-szek"><div class="os-szek-cim">Összetétel</div><ul class="os-lista"><li>A <span class="os-kulcs">miniszterelnökből és a miniszterekből</span> áll</li><li>A <span class="os-kulcs">minisztereket</span> a miniszterelnök javaslatára a K.eln. nevezi ki</li><li>A <span class="os-kulcs">miniszterelnököt</span> az Ogy választja a K.eln. javaslatára, a képviselők <span class="os-tul">több mint felének</span> szavazatával</li></ul></div><div class="os-szek"><div class="os-szek-cim">A miniszterelnök kiemelkedő szerepe</div><ul class="os-lista"><li>Ő határozza meg a Kormány <span class="os-kulcs">általános politikáját</span></li><li>A Kormány megbízatása a <span class="os-tul">miniszterelnök megbízatásához kötött</span></li><li>Kijelöli helyettesét; <span class="os-kulcs">feladatot szabhat</span> a kormánytagoknak; a Kormány döntését ő mondja ki és írja alá</li><li>A Kormány döntése: <span class="os-kulcs">rendelet, határozat, irányelv vagy elvi állásfoglalás</span></li></ul></div><div class="os-szek"><div class="os-szek-cim">10 pontos kérdések</div><ul class="os-lista"><li><strong>4.</strong> A Kormány és az államigazgatás viszonya — a Kormány az <span class="os-kulcs">államigazgatás csúcsszerve</span> (a hagyományos, hierarchikus szervekre igaz; az autonóm/önálló szervekre nem). Az Alaptörvény 15. cikk: a Kormány a <span class="os-kulcs">végrehajtó hatalom általános, a közigazgatás legfőbb szerve</span>, államigazgatási szerveket hozhat létre. A kormány és az államigazgatás egységes hatalmi centrum.</li></ul></div><div class="os-szek"><div class="os-szek-cim">5 pontos kérdések</div><ul class="os-lista"><li><strong>17.</strong> A tárca nélküli miniszter — az Alaptörvény lehetővé teszi a Kormány által meghatározott feladatkörre; <span class="os-kulcs">részletes feladatkörét kormányrendelet</span> állapítja meg, tevékenységét kijelölt minisztérium segíti. 2022 óta feladatkör-megnevezéssel nevezik ki őket.</li><li><strong>24.</strong> Az Áht. szerinti irányítási hatáskörök (5+) — a költségvetési szerv <span class="os-kulcs">alapítása-átalakítása-megszüntetése</span>, SZMSZ jóváhagyása, <span class="os-kulcs">vezető kinevezése-felmentése</span>, gazdasági vezető, törvényességi-szakszerűségi-hatékonysági ellenőrzés, döntés megsemmisítése, jóváhagyás, <span class="os-kulcs">egyedi utasítás</span>, jelentéstételre kötelezés, adatkezelés.</li></ul></div></div></article><article class="os-tetel"><div class="os-tetel-fej"><div class="os-tetel-kod">Á/10.</div><div class="os-tetel-cim">A Kormány működése (kormányülés)</div></div><div class="os-tetel-body"><div class="os-szek"><div class="os-szek-cim">A kormányülés</div><ul class="os-lista"><li>A Kormány <span class="os-kulcs">testületi szervként</span>, ülésein működik</li><li>Az ülést a <span class="os-kulcs">miniszterelnök</span> vezeti</li><li>A döntéseket a Kormány <span class="os-kulcs">ülésén hozza</span>; a döntés szövegének véglegesítését a miniszterelnök írja alá</li></ul></div><div class="os-szek"><div class="os-szek-cim">A Kormány döntései (forma szerint)</div><ul class="os-lista"><li><span class="os-kulcs">Rendelet</span> — jogszabály</li><li><span class="os-kulcs">Határozat</span></li><li><span class="os-kulcs">Irányelv</span> vagy <span class="os-kulcs">elvi állásfoglalás</span></li></ul></div><div class="os-szek"><div class="os-szek-cim">A miniszterelnök ülésvezetési jogosítványai</div><ul class="os-lista"><li>Összehívja és vezeti az ülést, megállapítja a napirendet</li><li>Kimondja a döntést, dönt a szavazás módjáról</li></ul></div><div class="os-szek"><div class="os-szek-cim">5 pontos kérdések</div><ul class="os-lista"><li><strong>19.</strong> A Kormány döntései (forma szerint) — a Kormány testületi szerv, döntéseit a kormányülésen hozza; szakmai előkészítő fórum a KÁT és az FKB. A döntés formája: <span class="os-kulcs">rendelet, határozat, irányelv vagy elvi állásfoglalás</span>; a miniszterelnök mondja ki és írja alá.</li><li><strong>20.</strong> A miniszterelnök ülésvezetési jogosítványai — a Kormány ülései <span class="os-kulcs">nem nyilvánosak</span>; a miniszterelnök vezetésével működik, ő készíti az ütemtervet, <span class="os-kulcs">kimondja és aláírja a döntést</span>, felmentést adhat a részvétel alól, beszámolásra hívhat fel. Hetente ülésezik, ügyrend szerint.</li></ul></div></div></article><article class="os-tetel"><div class="os-tetel-fej"><div class="os-tetel-kod">Á/11.</div><div class="os-tetel-cim">A kormányülés előkészítése; KÁT</div></div><div class="os-tetel-body"><div class="os-szek"><div class="os-szek-cim">Az előkészítés szakaszai</div><ul class="os-lista"><li>Az előterjesztéseket <span class="os-kulcs">egyeztetni</span> kell az érintett szervekkel (közigazgatási egyeztetés)</li><li>A <span class="os-kulcs">Közigazgatási Államtitkári Értekezlet (KÁT)</span> minden kormány-előterjesztést előzetesen megtárgyal</li></ul></div><div class="os-szek"><div class="os-szek-cim">A KÁT</div><ul class="os-lista"><li>A Kormány <span class="os-kulcs">segédszerve</span>, a kormányülés előkészítő fóruma</li><li>Tagjai a <span class="os-kulcs">közigazgatási államtitkárok</span>; a Miniszterelnöki Kormányiroda közigazgatási államtitkára vezeti</li><li>Feladata: az előterjesztések <span class="os-tul">szakmai-közigazgatási</span> szempontú előzetes megtárgyalása, a viták feloldása az ülés előtt</li></ul></div></div></article><div class="os-tanacs"><div class="os-tanacs-cim">Szombati ismétlési tanács</div><div class="os-tanacs-szov">Az első hét anyaga: alkotmányos alapok és a szervezetrendszer. Próbálja meg fejből végigmondani a 11 tételt — a Kormány és segédszervei jövő héten folytatódnak.</div></div>';
OSSZEF.h2='<div class="os-bevez"><div class="os-bevez-katlb">Szombati Ismétlés · 2. Hét</div><div class="os-bevez-cim">Államigazgatás (folytatás)</div><div class="os-bevez-alcim">Kormányszervek, területi igazgatás, funkciók · Á/12—Á/22.</div></div><article class="os-tetel"><div class="os-tetel-fej"><div class="os-tetel-kod">Á/12.</div><div class="os-tetel-cim">A kormánybiztos</div></div><div class="os-tetel-body"><div class="os-szek"><div class="os-szek-cim">Fogalom és kinevezés</div><ul class="os-lista"><li>A Kormány <span class="os-kulcs">segédszerve</span>, egyszemélyi vezető</li><li>A <span class="os-kulcs">Kormány nevezi ki</span> a miniszterelnök javaslatára <span class="os-tul">normatív határozattal</span></li><li>Miniszter vagy kormányzati főhivatal feladatkörébe nem tartozó, vagy <span class="os-kulcs">kiemelt fontosságú</span> feladatra</li><li>Határozott időre, <span class="os-tul">legfeljebb 4 évre</span>; megbízatása a miniszterelnök megbízatásával megszűnik</li></ul></div><div class="os-szek"><div class="os-szek-cim">Jellemzők</div><ul class="os-lista"><li>A <span class="os-kulcs">Kormány helyett és nevében</span> jár el, döntéseket is hozhat</li><li>Kinevezése lehet <span class="os-kulcs">szakmai</span> (összetett feladat) vagy <span class="os-kulcs">politikai</span> (kiemelt ügy)</li><li>Kormányrendelet <span class="os-kulcs">irányítási jogkörrel</span> ruházhatja fel; <span class="os-tul">biztosi jogviszony</span></li></ul></div><div class="os-szek"><div class="os-szek-cim">Rokon tisztségek</div><ul class="os-lista"><li><span class="os-kulcs">Miniszterelnöki biztos</span> — a miniszterelnök nevezi ki, legfeljebb megbízatása végéig</li><li><span class="os-kulcs">Miniszterelnöki megbízott</span> — diplomáciai, tanácsadói, eseti feladatra</li></ul></div></div></article><article class="os-tetel"><div class="os-tetel-fej"><div class="os-tetel-kod">Á/13.</div><div class="os-tetel-cim">Kormánybiztos és a többi segédszerv</div></div><div class="os-tetel-body"><div class="os-szek"><div class="os-szek-cim">A Kormány segédszervei</div><ul class="os-lista"><li><span class="os-kulcs">Kabinet, kormánybizottság, KÁT</span>, egyéb javaslattevő/véleményező testületek</li><li><span class="os-kulcs">Kormánybiztos, miniszterelnöki biztos, miniszterelnöki megbízott, politikai igazgató</span></li></ul></div><div class="os-szek"><div class="os-szek-cim">A kabinet</div><ul class="os-lista"><li><span class="os-tul">Törvény</span> ad felhatalmazást létrehozására; a Kormány ülései előtt <span class="os-kulcs">állásfoglalást ad</span></li><li>Funkciója a <span class="os-kulcs">koordináció</span>; főszabály szerint <span class="os-tul">nem hozhat döntést</span> a Kormány helyett</li><li>Jelenleg 4 kabinet: <span class="os-kulcs">Védelmi Tanács, Stratégiai, Gazdasági, Nemzetpolitikai Kabinet</span></li><li>Tagjai a feladatkörükben érintett miniszterek → <span class="os-tul">politikai karakter</span></li></ul></div><div class="os-szek"><div class="os-szek-cim">A kormánybizottság</div><ul class="os-lista"><li>Több <span class="os-kulcs">igazgatási ágazatot érintő</span> ügyekre; ágazatok közötti együttműködés koordinálása</li><li>Tagjai az érintett miniszterek; <span class="os-tul">normatív kormányhatározat</span> hozza létre</li><li>Ügydöntő jogkör csak <span class="os-kulcs">törvény/kormányrendelet</span> felhatalmazásával</li></ul></div><div class="os-megj">💡 Közös vonás: a segédszervek a Kormány működésének ülésen kívüli formái, többségükben testületek. Különbség: a kormánybiztos <span class="os-kulcs">egyszemélyi</span>, a kabinet és kormánybizottság <span class="os-kulcs">testületi</span>.</div><div class="os-szek"><div class="os-szek-cim">10 pontos kérdések</div><ul class="os-lista"><li><strong>13.</strong> A Kormány kabinetjei — a Kormány <span class="os-kulcs">segédszerve, testülete</span>; a Ksztv. ad felhatalmazást. A kormányülés előtt <span class="os-kulcs">állásfoglalást ad</span> kiemelt ügyekben (funkció: javaslattétel, tanácsadás, döntés-előkészítés, koordináció). 4 kabinet (Stratégiai, Gazdasági, Védelmi Tanács, Nemzetpolitikai). Tagjai az érintett miniszterek; <span class="os-kulcs">ügydöntő csak ha tv./Korm.r. engedi</span>.</li><li><strong>14.</strong> A kormánybizottság — a Kormány segédszerve; <span class="os-kulcs">több igazgatási ágazatot érintő</span> ügyekre, az ágazatok közötti együttműködés koordinálására. Rendelettel vagy normatív határozattal jön létre; tagjai az érintett miniszterek; <span class="os-kulcs">ügydöntő jogkör csak tv./Korm.r. felhatalmazásával</span>.</li><li><strong>15.</strong> Az interminiszteriális (tárcaközi) bizottság — egyéb javaslattevő-véleményező-tanácsadó <span class="os-kulcs">testület</span>, a Kormány hozza létre normatív határozattal (pl. Fejlesztéspolitikai Koordinációs Bizottság). Funkció: koordináció, konzultáció, kormányzaton kívüli szereplők bevonása. Tagjai érdekképviseleti-szakmai-tudományos képviselők; <span class="os-kulcs">ügydöntő jogköre nincs</span>.</li></ul></div><div class="os-szek"><div class="os-szek-cim">5 pontos kérdések</div><ul class="os-lista"><li><strong>18.</strong> A Kormány segédszervei — a Kormány ülésen kívüli szervezeti formái (többségükben testületek): <span class="os-kulcs">kabinet, kormánybizottság, KÁT</span>, egyéb javaslattevő-véleményező testületek, valamint a <span class="os-kulcs">kormánybiztos, miniszterelnöki biztos, miniszterelnöki megbízott</span> és a miniszterelnök politikai igazgatója.</li></ul></div></div></article><article class="os-tetel"><div class="os-tetel-fej"><div class="os-tetel-kod">Á/14.</div><div class="os-tetel-cim">A minisztérium vezetési struktúrája</div></div><div class="os-tetel-body"><div class="os-szek"><div class="os-szek-cim">Politikai vezetők</div><ul class="os-lista"><li><span class="os-kulcs">Miniszter</span> — a minisztérium vezetője, a Kormány tagja</li><li><span class="os-kulcs">Államtitkár</span> — a minisztert helyettesíti, ügydöntő jogkörrel; politikai vezető</li></ul></div><div class="os-szek"><div class="os-szek-cim">Szakmai vezetők</div><ul class="os-lista"><li><span class="os-kulcs">Közigazgatási államtitkár</span> — a hivatali szervezet vezetője; gondoskodik a minisztérium működéséről</li><li><span class="os-kulcs">Helyettes államtitkár</span> — a közigazgatási államtitkár irányítása alatt, szakmai szervezeti egységet vezet</li></ul></div><div class="os-szek"><div class="os-szek-cim">Belső szervezeti felépítés</div><ul class="os-lista"><li><span class="os-kulcs">Főosztály</span> → <span class="os-kulcs">osztály</span> — a szervezeti egységek alaptípusai</li><li>Az SZMSZ rögzíti a belső struktúrát és a feladatköröket</li></ul></div><div class="os-szek"><div class="os-szek-cim">10 pontos kérdések</div><ul class="os-lista"><li><strong>16.</strong> Az államtitkár jogállása — a minisztert vezetésében közvetlenül segíti; <span class="os-kulcs">a miniszter teljes jogkörű helyettese</span>, politikai felsővezető. A <span class="os-kulcs">köztársasági elnök nevezi ki</span> (a miniszterelnök javaslatára, a miniszter véleményével), esküt tesz. Megbízatása a miniszterelnök megbízatásának megszűnésével is megszűnik.</li><li><strong>17.</strong> A közigazgatási államtitkár jogállása — a minisztérium <span class="os-kulcs">hivatali szervezetét vezeti</span> (a miniszter irányítása alatt); minisztériumonként <span class="os-kulcs">csak egy</span>. <span class="os-kulcs">Kormányzati szolgálati jogviszonyban</span> álló szakmai felsővezető; a köztárs. elnök nevezi ki <span class="os-tul">határozatlan időre</span>, felsőfokú végzettséggel.</li><li><strong>18.</strong> A helyettes államtitkár jogállása — a minisztériumon belüli munkamegosztás szerint a <span class="os-kulcs">szakmai munkát irányítja</span>; egy minisztériumban <span class="os-kulcs">több is van</span>. A miniszterelnök nevezi ki. Minden minisztériumban működik egy az EU-források irányító hatósági feladataira, aki e körben nem utasítható.</li></ul></div></div></article><article class="os-tetel"><div class="os-tetel-fej"><div class="os-tetel-kod">Á/15.</div><div class="os-tetel-cim">A Miniszterelnökség</div></div><div class="os-tetel-body"><div class="os-szek"><div class="os-szek-cim">Jogállás</div><ul class="os-lista"><li><span class="os-kulcs">A miniszterelnök munkaszervezete</span> (a kormányzati igazgatás központi szerve)</li><li>Élén a <span class="os-kulcs">Miniszterelnökséget vezető miniszter</span> áll</li></ul></div><div class="os-szek"><div class="os-szek-cim">Funkciók</div><ul class="os-lista"><li>A miniszterelnök tevékenységének <span class="os-kulcs">szakmai és adminisztratív támogatása</span></li><li><span class="os-kulcs">Kormányzati koordináció</span>, a Kormány döntéseinek előkészítése-nyomon követése</li><li>Stratégiai feladatok, közigazgatás-szervezés</li></ul></div><div class="os-szek"><div class="os-szek-cim">5 pontos kérdések</div><ul class="os-lista"><li><strong>9.</strong> A Miniszterelnöki Kabinetiroda — a Kormányzati Központ minisztériuma, a <span class="os-kulcs">miniszterelnök munkaszervezete</span>; a miniszterelnök <span class="os-kulcs">kabinetfőnöke</span> vezeti miniszterként (kormányzati általános politikai koordináció + szakpolitikai feladatok). Szervezetileg ide tartozik a Miniszterelnöki Kormányiroda is.</li><li><strong>16.</strong> A Miniszterelnökség jogállása és funkciói — a Kormány munkáját segítő központi államigazgatási szerv, <span class="os-kulcs">minisztériumi jogállással</span>; hivatali szervezetét a közigazgatási államtitkár vezeti. Fő funkció: <span class="os-kulcs">összehangolás, koordináció</span> és szakpolitikai feladatok.</li></ul></div></div></article><article class="os-tetel"><div class="os-tetel-fej"><div class="os-tetel-kod">Á/16.</div><div class="os-tetel-cim">Önkormányzati államigazgatási feladatok</div></div><div class="os-tetel-body"><div class="os-szek"><div class="os-szek-cim">A keret</div><ul class="os-lista"><li>A helyi önkormányzatok <span class="os-kulcs">delegált (átruházott) államigazgatási feladatokat</span> is ellátnak</li><li>E körben a képviselő-testület <span class="os-tul">utasítást nem adhat</span>, a döntést <span class="os-tul">nem bírálhatja felül</span></li><li>Államigazgatási feladatot <span class="os-kulcs">csak törvény</span> állapíthat meg, <span class="os-kulcs">arányos költségvetési támogatással</span></li></ul></div><div class="os-szek"><div class="os-szek-cim">A feladatellátás szervei</div><ul class="os-lista"><li><span class="os-kulcs">Jegyző</span> — az államigazgatási hatósági feladatok zömét ellátja</li><li><span class="os-kulcs">Polgármester, képviselő-testület, bizottság</span> — törvényi felhatalmazás szerint</li><li>Pl. <span class="os-kulcs">anyakönyvi ügyek</span>, honvédelmi/polgári védelmi/katasztrófa-elhárítási feladatok</li></ul></div><div class="os-szek"><div class="os-szek-cim">10 pontos kérdések</div><ul class="os-lista"><li><strong>7.</strong> A helyi önkormányzatok törvényességi felügyelete — a <span class="os-kulcs">Kormány</span> biztosítja (a közigazgatási és területfejlesztési miniszter irányításával, a <span class="os-kulcs">kormányhivatalok útján</span>). Eleme az önkormányzati rendeletek jogrendbe illeszkedése: Alaptörvénybe ütközés → a Kormány az <span class="os-kulcs">AB</span>-hez fordul; más jogszabályba ütközés → a kormányhivatal a <span class="os-kulcs">Kúria Önkormányzati Tanácsához</span>. Eszköz: törvényességi felhívás, az Alaptörvénnyel ellentétes testület feloszlatása (Ogy, AB véleményével).</li><li><strong>22.</strong> Az önkormányzati államigazgatási feladatellátás indoka — a <span class="os-kulcs">delegált feladatok</span>: (1) a közigazgatási feladatok mennyisége megnőtt, az állam saját szervei útján nem tudja ellátni; (2) <span class="os-kulcs">gazdaságossági-hatékonysági</span> ok — minden településen működő helyhatóságot célszerű megbízni. Államigazgatási feladatot csak <span class="os-kulcs">törvény/Korm.r.</span> írhat elő, a képviselő-testület beleszólása nélkül, központi költségvetési támogatással.</li></ul></div></div></article><article class="os-tetel"><div class="os-tetel-fej"><div class="os-tetel-kod">Á/17.</div><div class="os-tetel-cim">A kormányhivatal</div></div><div class="os-tetel-body"><div class="os-szek"><div class="os-szek-cim">Vezetés</div><ul class="os-lista"><li><span class="os-kulcs">Főispán</span> — a fővárosi és vármegyei kormányhivatal <span class="os-tul">politikai vezetője</span></li><li><span class="os-kulcs">Főigazgató</span> — a hivatal szakmai vezetője</li><li><span class="os-kulcs">Igazgató</span> — a főigazgató munkáját segíti</li></ul></div><div class="os-szek"><div class="os-szek-cim">Szervezet</div><ul class="os-lista"><li>A hivatal <span class="os-kulcs">főosztályokra, osztályokra</span> tagolódik</li><li><span class="os-tul">Járási hivatalok</span> a kormányhivatal szervezeti egységei</li></ul></div><div class="os-szek"><div class="os-szek-cim">Feladatok</div><ul class="os-lista"><li><span class="os-kulcs">Hatósági feladatok</span> (építésügy, gyámügy, népegészségügy stb.)</li><li><span class="os-kulcs">Önkormányzatok törvényességi felügyelete</span></li><li>A területi államigazgatási szervek koordinációja</li></ul></div><div class="os-szek"><div class="os-szek-cim">10 pontos kérdések</div><ul class="os-lista"><li><strong>23.</strong> A kormányhivatal főbb feladat- és hatáskörei — a Kormány <span class="os-kulcs">általános hatáskörű területi államigazgatási szerve</span>, a főispán vezeti. Fő feladatok: <span class="os-kulcs">koordinációs</span> (a területi szervek összehangolása, államigazgatási kollégium), <span class="os-kulcs">ellenőrzési</span>, <span class="os-kulcs">általános jogorvoslati fórum</span> (elsőfokú önkorm. hatósági döntések), és a helyi önkormányzatok (+ nemzetiségi önkormányzatok) <span class="os-kulcs">törvényességi felügyelete</span>.</li></ul></div><div class="os-szek"><div class="os-szek-cim">5 pontos kérdések</div><ul class="os-lista"><li><strong>12.</strong> A KTM kormányhivatal feletti irányítási jogköre — a fővárosi/vármegyei kormányhivatal a <span class="os-kulcs">közigazgatási és területfejlesztési miniszter</span> irányítása alatt áll, de <span class="os-kulcs">nem teljes körűen</span>: a miniszter nem alapíthatja/szüntetheti meg, és nem nevezi ki a vezetőjét. A szakmai irányításban másik miniszter (szakmai irányító miniszter) is közreműködhet.</li><li><strong>13.</strong> A szakmai irányító miniszterek jogosítványai — kormányrendeletben meghatározva: a döntés megsemmisítése (új eljárásra utasítás), előzetes/utólagos jóváhagyás, <span class="os-kulcs">egyedi utasítás</span>, jelentéstételre kötelezés, törvényességi-szakszerűségi ellenőrzés. A főispánnak (és rajta keresztül a járási hivatalvezetőnek) egyedi utasítást adhatnak.</li></ul></div></div></article><article class="os-tetel"><div class="os-tetel-fej"><div class="os-tetel-kod">Á/18.</div><div class="os-tetel-cim">A járási hivatal</div></div><div class="os-tetel-body"><div class="os-szek"><div class="os-szek-cim">Jogállás</div><ul class="os-lista"><li>A <span class="os-kulcs">fővárosi/vármegyei kormányhivatal szervezeti egysége</span> (kirendeltsége)</li><li>A <span class="os-kulcs">legalsó szintű</span>, általános hatáskörű területi államigazgatási szerv</li></ul></div><div class="os-szek"><div class="os-szek-cim">Vezetés</div><ul class="os-lista"><li><span class="os-kulcs">Hivatalvezető</span> — a járási hivatal élén</li><li>A kormányhivatal főispánjának/főigazgatójának alárendelten</li></ul></div><div class="os-szek"><div class="os-szek-cim">Feladatkör</div><ul class="os-lista"><li>Az ügyfélközeli <span class="os-kulcs">hatósági ügyek</span> intézése (okmányügyek, szociális ügyek stb.)</li><li><span class="os-kulcs">Kormányablakok</span> működtetése — integrált ügyfélszolgálat</li></ul></div></div></article><article class="os-tetel"><div class="os-tetel-fej"><div class="os-tetel-kod">Á/19.</div><div class="os-tetel-cim">A közigazgatás alapfunkciói</div></div><div class="os-tetel-body"><div class="os-szek"><div class="os-szek-cim">Állandó és változó funkciók</div><ul class="os-lista"><li><span class="os-kulcs">Állandó funkciók</span> — a közigazgatás létéből fakadnak, időtől függetlenek</li><li><span class="os-kulcs">Változó funkciók</span> — a társadalmi-gazdasági viszonyok, politikai döntések szerint változnak</li></ul></div><div class="os-szek"><div class="os-szek-cim">Az államigazgatási feladatok köre</div><ul class="os-lista"><li>A feladatok meghatározása <span class="os-kulcs">módszertani kérdés</span> — történtek törekvések a felmérésükre</li><li><span class="os-kulcs">POSDCORB</span> (Gulick) — Planning, Organizing, Staffing, Directing, Coordinating, Reporting, Budgeting</li><li><span class="os-kulcs">Hatékony igazgatás modellje</span> és annak kritikája</li></ul></div><div class="os-szek"><div class="os-szek-cim">10 pontos kérdések</div><ul class="os-lista"><li><strong>26.</strong> Az államigazgatási feladatok felmérése — a feladatok számbavétele <span class="os-kulcs">feladatkataszterekkel</span>. Kísérletek: Magyary Zoltán „A magyar közigazgatás tükre" (<span class="os-ev">1932</span>, 9850 feladat), Államreform Bizottság (<span class="os-ev">2007</span>, 4000 feladat), Magyary Program (<span class="os-ev">2012</span>) <span class="os-kulcs">Állami feladatkataszter</span> (8000 jogszabály, 30 000 feladat).</li><li><strong>27.</strong> A POSDCORB — Fayol nyomán (tervezés, szervezés, parancsolás, egybehangolás, ellenőrzés) → Gulick és Urwick: <span class="os-kulcs">P</span>lanning, <span class="os-kulcs">O</span>rganizing, <span class="os-kulcs">S</span>taffing, <span class="os-kulcs">D</span>irecting, <span class="os-kulcs">Co</span>ordinating, <span class="os-kulcs">R</span>eporting, <span class="os-kulcs">B</span>udgeting. Az igazgatás <span class="os-kulcs">funkcióit</span> foglalja össze; a közigazgatást a célja (közérdekűség) különbözteti meg.</li><li><strong>28.</strong> A hatékony igazgatás modellje és kritikája — a Weber-féle <span class="os-kulcs">bürokratikus szervezeten</span> alapul: szigorú hierarchia (a felettes utasít), a vezető akarata érvényesül, <span class="os-kulcs">szűrt, egyirányú információáramlás</span>, zárt-átláthatatlan működés. <span class="os-kulcs">Kritika</span>: ezek a jegyek egy demokratikus jogállam közigazgatásának külső kapcsolataiban elfogadhatatlanok.</li></ul></div><div class="os-szek"><div class="os-szek-cim">5 pontos kérdések</div><ul class="os-lista"><li><strong>21.</strong> A közigazgatás funkciói a szociológia szerint — <span class="os-kulcs">integráció</span> (a társadalmi érdekek becsatornázása-kiegyenlítése, a társadalmi alrendszerek egyensúlya) és <span class="os-kulcs">allokáció</span> (a társadalmi erőforrások egyenletesebb elosztása).</li><li><strong>22.</strong> A végrehajtás mint funkció — jogtudomány: <span class="os-kulcs">jogszabályok végrehajtása</span>; politikatudomány (Wilson): a politikusok döntéseinek végrehajtása. Három tevékenység útján: <span class="os-kulcs">jogalkotás, jogalkalmazás, szervezés</span>.</li><li><strong>23.</strong> Az államigazgatási feladatok körének meghatározása — <span class="os-kulcs">feladatkataszterek</span> felállítása; a 2012-es Állami feladatkataszter a közfeladatokat ágazatcsoport–ágazat–...–intézkedés bontásban tartalmazza, a felelős szervvel, költségvetéssel; segíti a deregulációt.</li></ul></div></div></article><article class="os-tetel"><div class="os-tetel-fej"><div class="os-tetel-kod">Á/20.</div><div class="os-tetel-cim">Államigazgatási tevékenységfajták</div></div><div class="os-tetel-body"><div class="os-szek"><div class="os-szek-cim">Fő tevékenységfajták</div><ul class="os-lista"><li><span class="os-kulcs">Jogalkotó tevékenység</span> — szűk (rendeletalkotás) és tág értelemben</li><li><span class="os-kulcs">Hatósági jogalkalmazás</span> — egyedi ügyekben döntés (engedély, kötelezés)</li><li><span class="os-kulcs">Hatósági felügyelet</span> — a jogkövető magatartás ellenőrzése</li><li><span class="os-kulcs">Szervező-szolgáltató tevékenység</span></li></ul></div><div class="os-szek"><div class="os-szek-cim">Fontos elhatárolások</div><ul class="os-lista"><li><span class="os-kulcs">Hatáskör vs. feladatkör</span> — a hatáskör konkrét döntési jogosultság</li><li><span class="os-kulcs">Kiadmányozás</span> — a döntés aláírásának joga (nem azonos a hatáskörrel)</li><li><span class="os-kulcs">Hatáskör-átruházás és szubdelegálás tilalma</span></li></ul></div><div class="os-szek"><div class="os-szek-cim">10 pontos kérdések</div><ul class="os-lista"><li><strong>29.</strong> Az államigazgatási hatósági jogalkalmazás — az államigazgatási jogalkalmazáson belül: az erre feljogosított szerv <span class="os-kulcs">hatóság</span>, amely a normát a <span class="os-kulcs">hierarchián kívül álló jogalanyokkal szemben</span>, közhatalom birtokában, <span class="os-kulcs">egyoldalú döntéssel</span> érvényesíti. Hatósági jogkört csak jogszabály adhat (Ákr., 2018-tól).</li><li><strong>31.</strong> A kiadmányozás vs. a hatáskör — a <span class="os-kulcs">hatáskört</span> csak jogszabály telepítheti, átruházása csak engedéllyel (szubdelegálás tilos). A <span class="os-kulcs">kiadmányozási jog</span> a döntés/intézkedés kiadásának joga, a szerven belül átruházható; a kiadmányozó a hatáskörrel rendelkező nevében jár el, ami <span class="os-kulcs">nem érinti a vezető hatáskörét és felelősségét</span>.</li></ul></div><div class="os-szek"><div class="os-szek-cim">5 pontos kérdések</div><ul class="os-lista"><li><strong>29.</strong> Az államigazgatási jogalkalmazás — a jog érvényesítését célzó tevékenység: egyedi jogalkalmazói aktusban <span class="os-kulcs">jogot/kötelezettséget állapít meg, módosít, szüntet meg</span>, tényt-adatot igazol, vagy jogvitát dönt el. Funkciója a végrehajtás.</li><li><strong>30.</strong> A hatáskör-átruházás és a szubdelegálás tilalma — <span class="os-kulcs">hatáskör-átruházás tilalma</span>: a szerv nem bízhat meg mást a hatáskörébe tartozó feladattal (kivéve, ha jogszabály engedi). <span class="os-kulcs">Szubdelegálás tilalma</span>: az átruházott hatáskör tovább nem ruházható.</li><li><strong>31.</strong> A hatáskör és a feladatkör — <span class="os-kulcs">Feladatkör</span>: a szerv által ellátandó feladatok összessége (csak jogszabály hozhat létre). <span class="os-kulcs">Hatáskör</span>: a feladat ellátásához alkalmazható jogi eszközök (engedélyezés, tiltás, szankcionálás) összessége — csak jogszabály állapíthatja meg.</li><li><strong>32.</strong> Az államigazgatás jogalkotó tevékenysége — <span class="os-kulcs">Szűk értelemben</span>: a jogalkotásra jogosult szervek jogszabályt/közjogi szervezetszabályozó eszközt bocsátanak ki. <span class="os-kulcs">Tág értelemben</span>: a jogalkotási folyamat minden szakasza (előkészítés, dereguláció).</li><li><strong>33.</strong> Az államigazgatási tevékenységfajta — azt mutatja meg, milyen <span class="os-kulcs">módon, eszközökkel és igazgatási tevékenység révén</span> látják el az államigazgatási feladatokat; olyan <span class="os-kulcs">feladatcsoportok</span>, amelyeket lényeges tulajdonságuk összefűz.</li></ul></div></div></article><article class="os-tetel"><div class="os-tetel-fej"><div class="os-tetel-kod">Á/21.</div><div class="os-tetel-cim">A hatósági felügyelet típusai</div></div><div class="os-tetel-body"><div class="os-szek"><div class="os-szek-cim">A hatósági felügyelet</div><ul class="os-lista"><li>A <span class="os-kulcs">közigazgatási hierarchián kívül álló</span> jogalanyokra értendő</li><li>Jogszabályban meghatározott <span class="os-kulcs">tevékenység ellenőrzésére</span> irányul, az <span class="os-tul">önkéntes jogkövetésből</span> kiindulva</li></ul></div><div class="os-szek"><div class="os-szek-cim">A típusok</div><ol class="os-szam"><li><span class="os-kulcs">Speciális hatósági felügyelet (ex lege)</span> — felügyeleti szervek (fogyasztóvédelem, közegészségügy, munkavédelem)</li><li><span class="os-kulcs">Általános hatósági felügyelet</span> — a jogalkalmazó szerv ellenőrzi a saját aktusa követését (pl. építési engedély → ellenőrzés)</li><li><span class="os-kulcs">Törvényességi felügyelet</span> — köztestületek, állami vállalatok felett; <span class="os-tul">NEM hatósági felügyelet</span> (Ksztv., Mötv.)</li></ol></div><div class="os-megj">💡 Közös: mindkét felügyelet keretében tett intézkedés/döntés ellen <span class="os-kulcs">bírói úton</span> van jogorvoslat. A törvényességi felügyelet alanya soha nem lehet magánszemély.</div><div class="os-szek"><div class="os-szek-cim">10 pontos kérdések</div><ul class="os-lista"><li><strong>30.</strong> A hatósági felügyelet — a hatósági tevékenység egyik formája (NEM a szervezetrendszeri felügyelet). Az <span class="os-kulcs">önkéntes jogkövetés</span> esetén a hatóság feladata a <span class="os-kulcs">jogkövető magatartás ellenőrzése</span> és intézkedés, ha az eltér az előírttól. Az <span class="os-kulcs">ex lege</span> szabályozási módhoz kötődik (a norma közvetlenül hat a jogalanyokra).</li></ul></div></div></article><article class="os-tetel"><div class="os-tetel-fej"><div class="os-tetel-kod">Á/22.</div><div class="os-tetel-cim">A nemzeti vagyon</div></div><div class="os-tetel-body"><div class="os-szek"><div class="os-szek-cim">Fogalom</div><ul class="os-lista"><li>Az <span class="os-kulcs">állam és a helyi önkormányzat tulajdona</span> (Alaptörvény 38-39. cikk; <span class="os-tul">2011. évi CXCVI. tv., Nvtv.</span>)</li><li>Ide tartozik többek között: kizárólagos tulajdonú dolgok, pénzügyi eszközök, vagyoni értékű jogok, légtér, kibocsátási egységek, <span class="os-kulcs">kulturális javak, régészeti lelet, nemzeti adatvagyon</span></li></ul></div><div class="os-szek"><div class="os-szek-cim">A vagyonkategóriák</div><ol class="os-szam"><li><span class="os-kulcs">Forgalomképtelen nemzeti vagyon</span> — nem idegeníthető el (pl. folyók, törzshálózati vasúti pályák)</li><li><span class="os-kulcs">Nemzetgazdasági szempontból kiemelt jelentőségű</span> — pl. műemlékek (Citadella, Operaház), állami társaságok (MVM, MÁV, Magyar Posta)</li><li><span class="os-kulcs">Korlátozottan forgalomképes</span> — törvényi/önkormányzati feltételekkel rendelkezhető</li><li><span class="os-kulcs">Üzleti vagyon</span> — engedély nélkül elidegeníthető, csak átlátható szervezettel köthető szerződés</li></ol></div><div class="os-szek"><div class="os-szek-cim">Az állami vagyon rendeltetése szerint</div><div class="os-grid"><div><div class="alcim">Kincstári vagyon</div>Kizárólagos tulajdon + korlátozottan forgalomképes + nemzetgazdaságilag kiemelt</div><div><div class="alcim">Üzleti vagyon</div>A nem kincstári (önkormányzatnál: nem törzsvagyon) rész</div></div></div></div></article><div class="os-tanacs"><div class="os-tanacs-cim">Szombati ismétlési tanács</div><div class="os-tanacs-szov">A 2. hét anyaga: a Kormány segédszervei, a központi és területi szervek, a közigazgatási funkciók. Jövő héten zárjuk a személyzettel és a reformokkal.</div></div>';
OSSZEF.h3='<div class="os-bevez"><div class="os-bevez-katlb">Szombati Ismétlés · 3. Hét</div><div class="os-bevez-cim">Államigazgatás — befejezés + áttekintés</div><div class="os-bevez-alcim">Személyzet, felelősség, reform · Á/23—Á/31.</div></div><article class="os-tetel"><div class="os-tetel-fej"><div class="os-tetel-kod">Á/23.</div><div class="os-tetel-cim">A szervezeti és működési szabályzat (SZMSZ)</div></div><div class="os-tetel-body"><div class="os-szek"><div class="os-szek-cim">Jogi szabályozás</div><ul class="os-lista"><li>A szervezet és működés rendjében nagy szerepet kapnak a <span class="os-kulcs">belső szabályzatok</span></li><li>Megalkotásukra <span class="os-kulcs">jogszabály ad felhatalmazást</span></li><li>Jellemzően <span class="os-kulcs">közjogi szervezetszabályozó eszköz</span> formájában (normatív utasítás)</li></ul></div><div class="os-szek"><div class="os-szek-cim">Főbb elemek</div><ul class="os-lista"><li>A szerv <span class="os-kulcs">jogállása, feladat- és hatásköre</span></li><li>A <span class="os-kulcs">szervezeti felépítés</span> (egységek, vezetők)</li><li>A <span class="os-kulcs">működés rendje</span>, a kiadmányozás, helyettesítés szabályai</li><li>Az SZMSZ-t az <span class="os-kulcs">irányító/felügyeleti szerv hagyja jóvá</span></li></ul></div></div></article><article class="os-tetel"><div class="os-tetel-fej"><div class="os-tetel-kod">Á/24.</div><div class="os-tetel-cim">Zárt rendszerű személyzeti politika</div></div><div class="os-tetel-body"><div class="os-szek"><div class="os-szek-cim">A személyzeti politika fogalma</div><ul class="os-lista"><li>A közigazgatási alkalmazottak kiválasztására, képzésére, bérezésére, előmenetelére, jogaira-kötelezettségeire vonatkozó <span class="os-kulcs">egységes, hosszú távú célkitűzések</span></li><li>Funkciója: összeegyeztetni az <span class="os-tul">állam, alkalmazottak, lakosság</span> érdekeit</li></ul></div><div class="os-szek"><div class="os-szek-cim">A zárt rendszer jellemzői</div><ul class
