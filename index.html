="os-lista"><li><span class="os-kulcs">Központilag kialakított és irányított</span>; egységes törvény/jogszabályrendszer szabályozza (<span class="os-tul">közszolgálati pragmatika</span>)</li><li>A munka <span class="os-kulcs">élethivatás</span> — élethossziglan, nyugdíjazásig</li><li>Két alappillér: <span class="os-kulcs">kiválasztás</span> és <span class="os-kulcs">karrier (karrierrendszer)</span></li><li><span class="os-kulcs">Elmozdíthatatlanság elve</span> — fokozott védelem az elbocsátással szemben</li></ul></div><div class="os-szek"><div class="os-szek-cim">Előmenetel és díjazás</div><ul class="os-lista"><li>A szakmai előmenetel alapja: <span class="os-kulcs">szolgálati idő</span> + <span class="os-kulcs">iskolai végzettség</span></li><li>Rangfokozatok és kapcsolódó díjazás; az egyéni teljesítmény szerepe <span class="os-tul">mérsékelt</span></li><li>A díjazásnak <span class="os-kulcs">kötött rendje</span> van (besorolási osztály, fokozat, szolgálati hely)</li><li>Gyakran <span class="os-kulcs">tiltják/korlátozzák a másodállást</span></li></ul></div><div class="os-szek"><div class="os-szek-cim">5 pontos kérdések</div><ul class="os-lista"><li><strong>8.</strong> A kormánytisztviselői hivatásetikai alapelvek (5+) — az <span class="os-kulcs">elkötelezettség</span>, a <span class="os-kulcs">nemzeti érdekek előnyben részesítése</span>, az igazságosság, a méltányosság, a méltóság, a tisztesség, az <span class="os-kulcs">előítéletektől való mentesség</span> és a felelősségtudat (Kit. + Kormánytisztviselői Hivatásetikai Kódex).</li><li><strong>34.</strong> A közigazgatási személyzeti politika fogalma — az alkalmazottak kiválasztására, képzésére, bérezésére, előmenetelére, jogaira-kötelezettségeire vonatkozó, <span class="os-kulcs">hosszú távú, deklarált egységes célkitűzések</span>. Funkciója: összeegyeztetni az <span class="os-kulcs">állam, az alkalmazottak és a lakosság</span> érdekeit.</li><li><strong>35.</strong> A közigazgatási pálya biztonsága — a dolgozó <span class="os-kulcs">elmozdíthatatlansága</span>, az elbocsátással szembeni fokozott védelem; a zárt rendszer két pillére (kiválasztás + karrier) közül a <span class="os-kulcs">kiválasztás</span> biztosítja. Az alkalmazás élethossziglani szolgálat/hivatás.</li><li><strong>36.</strong> Asszimilációs és differenciált rendszer — <span class="os-kulcs">Asszimilációs</span>: a köz- és versenyszféra azonos jogi rezsim (munkajog) alá esik. <span class="os-kulcs">Differenciált</span>: a közhatalmat gyakorló dolgozót többletjogosítványokkal kell felruházni (a kikényszeríthető döntések miatt), amit többletkötelezettségek ellentételeznek.</li><li><strong>44.</strong> A kormányzati szolgálati jogviszony fogalma — a Kormány irányítása alá tartozó szerveknél a szakmai állomány <span class="os-kulcs">kormánytisztviselőként</span> a <span class="os-kulcs">Kit. (2018. évi CXXV. tv.)</span> hatálya alatt; az előmeneteli rendszer megszűnt, helyét az <span class="os-kulcs">álláshely-alapú foglalkoztatás</span> vette át. (Felsővezető / vezető / kormánytisztviselő szintek.)</li><li><strong>45.</strong> A kormányzati szolgálati jogviszony a munkajoghoz képest — <span class="os-kulcs">különleges jogviszony</span>: a feleket többletkötelezettségek terhelik és többletjogosultságok illetik. <span class="os-kulcs">Hasonlóság</span>: mindkettő munkavégzésre irányul. <span class="os-kulcs">Különbség</span>: a közszolgálat ismeri a fegyelmi felelősséget (hierarchikus viszony), a munkajog nem (egyenrangú felek).</li></ul></div></div></article><article class="os-tetel"><div class="os-tetel-fej"><div class="os-tetel-kod">Á/25.</div><div class="os-tetel-cim">Nyitott rendszerű személyzeti politika</div></div><div class="os-tetel-body"><div class="os-szek"><div class="os-szek-cim">A nyitott (állásrendszerű) közszolgálat</div><ul class="os-lista"><li>A <span class="os-kulcs">magánigazgatáshoz hasonlít</span></li><li>Korlátozás nélküli <span class="os-kulcs">belépés</span> és <span class="os-kulcs">egyoldalú megszüntetés</span></li><li>Az alkalmazottakat <span class="os-kulcs">meghatározott feladatra szerződtetik</span>; a feladat megszűnésével könnyen elbocsáthatók</li></ul></div><div class="os-szek"><div class="os-szek-cim">Jellemzők</div><ul class="os-lista"><li><span class="os-kulcs">Politikai szempontú kiválasztás</span> lehetséges → USA: <span class="os-tul">„zsákmányrendszer"</span></li><li>Hátrány: nagy <span class="os-kulcs">fluktuáció</span> a választási eredmények függvényében</li><li>Az előmenetelt nem garantálja kiszámítható szabályozás, de az <span class="os-kulcs">egyéni képességek gyorsabb előrelépést</span> tesznek lehetővé</li><li>A díjazás az <span class="os-kulcs">egyéni teljesítménytől</span> függ, versenyképes</li></ul></div><div class="os-megj">💡 A gyakorlatban keveredhet: <span class="os-kulcs">politikai alapú kinevezésű vezetők</span> irányítják a <span class="os-kulcs">szakmai alapon kiválasztott</span> apparátust.</div><div class="os-szek"><div class="os-szek-cim">5 pontos kérdések</div><ul class="os-lista"><li><strong>37.</strong> A közigazgatási pálya nyitottsága — mindenki számára <span class="os-kulcs">egyenlő eséllyel elérhető</span> (származásra, osztályra, nemre, vagyonra hivatkozva senki nem zárható ki). Mo.-on 1848 előtt a jogegyenlőség hiánya miatt nem volt biztosított; a kiegyezés (1867) után. Jelentősége: a <span class="os-kulcs">demokratikus közigazgatás</span> alapfeltétele. (NEM keverendő a nyílt rendszerrel!)</li></ul></div></div></article><article class="os-tetel"><div class="os-tetel-fej"><div class="os-tetel-kod">Á/26.</div><div class="os-tetel-cim">Személyzeti politika fejlődése 1867-től</div></div><div class="os-tetel-body"><div class="os-szek"><div class="os-szek-cim">A főbb korszakok</div><ol class="os-szam"><li><span class="os-ev">1867-</span> a <span class="os-kulcs">pálya nyitottsága</span> és a zárt rendszerű személyzeti politika kiépítésének kezdete (kiegyezés)</li><li><span class="os-ev">1914</span> kiépül a <span class="os-kulcs">nemzetközileg is korszerű zárt rendszer</span></li><li><span class="os-ev">1945</span> fordulat: <span class="os-kulcs">zsákmányrendszer</span> sajátos formája, a képesítési előírások feloldása</li><li><span class="os-ev">1945-1949</span> többpártrendszer: pártszempontok, a <span class="os-tul">karrierrendszer megszűnése</span></li><li><span class="os-ev">1949-</span> <span class="os-kulcs">államigazgatási</span> személyzeti politika: párthűség, származási előny, a presztízs romlása, óriási fluktuáció</li><li><span class="os-ev">1957-1989</span> konszolidáció a szocialista rendszer keretei között</li><li><span class="os-ev">1992-</span> a <span class="os-kulcs">demokratikus, zárt rendszerű</span> közszolgálat újjáépítése</li></ol></div><div class="os-szek"><div class="os-szek-cim">10 pontos kérdések</div><ul class="os-lista"><li><strong>8.</strong> A kormányzati rendszer és államigazgatás fejlődése (kiegyezés–1989) — <span class="os-ev">1867</span> parlamentáris monarchia → I. vh. után változó (1918 népköztársaság, 1919 Tanácsköztársaság) → <span class="os-ev">1920</span> Horthy, alkotmányos monarchia → <span class="os-ev">1946</span> köztársaság → <span class="os-ev">1949</span> Magyar Népköztársaság (Elnöki Tanács, tanácsrendszer, a Legfőbb ÁSZ és a Közig. Bíróság megszűnt) → <span class="os-ev">1989</span> parlamentáris köztársaság.</li><li><strong>43.</strong> A Magyary Programok „Személyzet" beavatkozási területe — MP 11.0 (2011) és MP 12.0 (2012); a Személyzet terület célja a <span class="os-kulcs">személyi állomány megújítása</span>, <span class="os-kulcs">életpályamodell</span> (a karrierrendszer előnyeivel + rugalmasság), az átjárhatóság (kormánytisztviselő-honvéd-rendészeti). Megvalósult: Kormányzati Személyzeti Stratégia, jogállási törvények, <span class="os-kulcs">Magyar Kormánytisztviselői Kar</span>, etikai kódexek.</li></ul></div><div class="os-szek"><div class="os-szek-cim">5 pontos kérdések</div><ul class="os-lista"><li><strong>38.</strong> Személyzeti politika 1867–1945 — a <span class="os-kulcs">zárt rendszer</span> kiépítése a kiegyezéstől; az I. világháborúra (<span class="os-ev">1914</span>) létrejött a nemzetközileg is korszerű zárt rendszer, amit a két háború között finomítottak. <span class="os-ev">1945</span>: fordulat — a zsákmányrendszer sajátos formája, a képesítési előírások feloldása.</li><li><strong>39.</strong> Személyzeti politika 1945–1949 — többpártrendszer; a pártok <span class="os-kulcs">saját támogatóikkal töltötték fel</span> a tisztségeket (versengés) → a szakszerűség eltűnése és a <span class="os-kulcs">karrierrendszer megszűnése</span>. 1948: az önkormányzati állások államosítása. 1949: újabb fordulat.</li><li><strong>40.</strong> Személyzeti politika 1949–1957 — <span class="os-ev">1949</span> „a fordulat éve": a speciális jogállás megszűnt (Mt. kiterjesztése), az állomány politikai cseréje, a képesítési előírások eltörlése, <span class="os-kulcs">kétszeres létszámnövekedés</span>. 1950–56 a bizonytalanság kora; 1957: az érdemeken alapuló politikára való áttérés kezdete.</li><li><strong>41.</strong> Személyzeti politika 1957–1989 — a képesítési előírások lassú, következetlen visszavezetése; a vezetőknél a <span class="os-kulcs">politikai megbízhatóság</span> elsődlegessége. <span class="os-ev">1978</span> Államigazgatási Főiskola (felsőfokú szakemberképzés). Az egységes törvényi szabályozás tervezése megkezdődött, de a rendszerváltás előtt nem fogadták el.</li><li><strong>42.</strong> Személyzeti politika 1992 után — <span class="os-ev">1992</span> <span class="os-kulcs">Ktv. és Kjt.</span> (zárt rendszer); 2006-tól a nyitott rendszer elemei (NPM); <span class="os-ev">2010</span> Ksztv. (kormánytisztviselő); <span class="os-ev">2011</span> Kttv. (közszolgálati tisztviselő); <span class="os-ev">2019</span> <span class="os-kulcs">Kit.</span> (álláshely-alapú, egységes szabályozás).</li></ul></div></div></article><article class="os-tetel"><div class="os-tetel-fej"><div class="os-tetel-kod">Á/27.</div><div class="os-tetel-cim">A fegyelmi felelősség</div></div><div class="os-tetel-body"><div class="os-szek"><div class="os-szek-cim">A fegyelmi felelősség</div><ul class="os-lista"><li>Az államigazgatási dolgozó <span class="os-kulcs">vétkes kötelezettségszegése</span> esetén</li><li>A <span class="os-kulcs">kormányzati szolgálati jogviszonyból</span> eredő kötelezettség megszegése</li><li>Eljárás: <span class="os-kulcs">fegyelmi eljárás</span> (vizsgálat, fegyelmi tanács)</li></ul></div><div class="os-szek"><div class="os-szek-cim">Kiszabható büntetések</div><ul class="os-lista"><li><span class="os-kulcs">Megrovás</span></li><li><span class="os-kulcs">Az előmenetelhez szükséges várakozási idő meghosszabbítása</span></li><li><span class="os-kulcs">Fizetési fokozatban visszavetés / illetménycsökkentés</span></li><li><span class="os-kulcs">Hivatalvesztés / a jogviszony megszüntetése</span> (legsúlyosabb)</li></ul></div><div class="os-szek"><div class="os-szek-cim">10 pontos kérdések</div><ul class="os-lista"><li><strong>33.</strong> A fegyelmi és a kártérítési felelősség különbsége — <span class="os-kulcs">Fegyelmi</span>: a jogviszonyból eredő kötelezettség vétkes megszegése; fegyelmi eljárás; büntetés (megrovás → illetménycsökkentés → nem vezetői álláshelyre → hivatalvesztés). <span class="os-kulcs">Kárfelelősség</span>: egy tényállási elemmel bővebb — <span class="os-kulcs">kárt is okoz</span>, okozati összefüggéssel; gondatlan (max. 4 havi illetmény) vs. szándékos/súlyosan gondatlan (teljes kár).</li></ul></div><div class="os-szek"><div class="os-szek-cim">5 pontos kérdések</div><ul class="os-lista"><li><strong>43.</strong> Az államigazgatási dolgozók felelősségi alakzatai — fegyelmi felelősség, <span class="os-kulcs">vezetői eredményfelelősség</span>, anyagi (kár)felelősség, <span class="os-kulcs">etikai felelősség</span>, büntetőjogi felelősség.</li><li><strong>47.</strong> Az etikai vétség — az <span class="os-kulcs">etikai szabályok megszegése</span> (hivatásetikai alapelvek/részletszabályok — Kódex); <span class="os-kulcs">nem jogi felelősségi forma</span>. Jelentősége: a tételes jogot nem sértő, de közösségellenes, nemkívánatos cselekmények visszaszorítása.</li></ul></div></div></article><article class="os-tetel"><div class="os-tetel-fej"><div class="os-tetel-kod">Á/28.</div><div class="os-tetel-cim">A kárfelelősség</div></div><div class="os-tetel-body"><div class="os-szek"><div class="os-szek-cim">A kárfelelősség feltételei</div><ul class="os-lista"><li>Az államigazgatási dolgozó a <span class="os-kulcs">jogviszonyából eredő kötelezettsége</span> vétkes megszegésével okozott kárért felel</li><li>Feltételek: <span class="os-kulcs">kötelezettségszegés</span>, <span class="os-kulcs">kár</span>, <span class="os-kulcs">okozati összefüggés</span>, <span class="os-kulcs">vétkesség</span></li></ul></div><div class="os-szek"><div class="os-szek-cim">Típusok és kimentés</div><ul class="os-lista"><li><span class="os-kulcs">Gondatlan</span> károkozás — korlátozott mértékű felelősség</li><li><span class="os-kulcs">Szándékos</span> károkozás — teljes kártérítés</li><li><span class="os-kulcs">Megőrzési felelősség</span> és <span class="os-kulcs">leltárhiányért való felelősség</span> (objektív elemekkel)</li><li>Kimentés: ha a kár <span class="os-tul">elháríthatatlan külső ok</span> (vis maior) miatt következett be</li></ul></div><div class="os-szek"><div class="os-szek-cim">10 pontos kérdések</div><ul class="os-lista"><li><strong>32.</strong> Az objektív felelősség — a felelősséget <span class="os-kulcs">a jogsértés önmagában megalapozza</span> (vétkességre tekintet nélkül); az egyetlen kimentési ok a <span class="os-kulcs">vis maior</span>. Pl. a megőrzési és a <span class="os-kulcs">leltárfelelősség</span>. A kárfelelősséget is fegyelmi eljárás keretében állapítják meg.</li></ul></div><div class="os-szek"><div class="os-szek-cim">5 pontos kérdések</div><ul class="os-lista"><li><strong>46.</strong> A vis maior — olyan <span class="os-kulcs">elháríthatatlan külső erőhatalom</span> közrehatása, amely a cselekménytől függetlenül bekövetkezett volna és a kárt ez okozta. Az <span class="os-kulcs">objektív felelősség egyetlen kimentési oka</span> (pl. leltárfelelősségnél).</li></ul></div></div></article><article class="os-tetel"><div class="os-tetel-fej"><div class="os-tetel-kod">Á/29.</div><div class="os-tetel-cim">A vezetői eredményfelelősség</div></div><div class="os-tetel-body"><div class="os-szek"><div class="os-szek-cim">Az eredményfelelősség</div><ul class="os-lista"><li>A vezető <span class="os-kulcs">a szervezeti egysége eredményességéért</span> felel — nem feltétlenül jogsértés alapján</li><li>Lényege: a <span class="os-kulcs">teljesítmény, az elért eredmény</span> alapján való elszámoltathatóság</li></ul></div><div class="os-szek"><div class="os-szek-cim">A jogi felelősségtől való különbözősége</div><div class="os-grid"><div><div class="alcim">Jogi felelősség</div><span class="os-kulcs">Jogsértéshez</span> kötött, utólagos, szankcióval jár (fegyelmi, kártérítési, büntetőjogi, etikai)</div><div><div class="alcim">Eredményfelelősség</div><span class="os-kulcs">Nem feltétlenül jogsértés</span>; a vezetői teljesítmény értékeléséhez kötődik, a megbízatás megújítása/visszavonása lehet a következménye</div></div></div><div class="os-megj">💡 Az államigazgatási dolgozó jogi felelősségi alakzatai: <span class="os-kulcs">fegyelmi, kártérítési, büntetőjogi, etikai (hivatásetikai)</span> felelősség.</div><div class="os-szek"><div class="os-szek-cim">10 pontos kérdések</div><ul class="os-lista"><li><strong>34.</strong> Az államigazgatási dolgozók büntetőjogi felelőssége — a Btk.-ba ütköző magatartás (bűncselekmény) alapozza meg; a Btk. a <span class="os-kulcs">hivatalos személy</span> / közfeladatot ellátó személy fogalmát használja. A <span class="os-kulcs">hivatali bűncselekményeket</span> csak ők követhetik el (pl. hivatali visszaélés); más bűncselekménynél <span class="os-kulcs">súlyosabb elbírálás</span> alá esnek (pl. közokirat-hamisítás).</li><li><strong>35.</strong> Az általában vett jogi felelősség — szankció kilátásba helyezése, ha valaki <span class="os-kulcs">felróható módon jogellenes</span> magatartást tanúsít. Két tényező: a <span class="os-kulcs">jogsértés</span> (objektív feltétel) és — szükség esetén — a <span class="os-kulcs">felróhatóság/vétkesség</span> (szubjektív feltétel).</li><li><strong>36.</strong> A közszolgálati etikai felelősség — etikai szabályok megszegése → <span class="os-kulcs">etikai vétség</span> → etikai felelősség. Jelentősége: a <span class="os-kulcs">tételes jogot nem sértő</span>, de közösségellenes anomáliák visszaszorítása. Alapelvek: elkötelezettség, nemzeti érdek, igazságosság, méltányosság stb. (a Kar etikai eljárást folytat).</li></ul></div><div class="os-szek"><div class="os-szek-cim">5 pontos kérdések</div><ul class="os-lista"><li><strong>48.</strong> A hivatásetikai normák funkciója — a <span class="os-kulcs">jogi normák kiegészítése, pontosítása</span>: a bizonytalan tartalmú/határozatlan jogi fogalmakat (méltányosság, igazságosság, szokásos mértékű ajándék) az etikai normák töltik ki tartalommal.</li><li><strong>54.</strong> A Magyar Kormánytisztviselői Kar — a kormánytisztviselők, állami tisztviselők <span class="os-kulcs">önkormányzattal rendelkező szakmai köztestülete</span>, <span class="os-kulcs">kötelező tagsággal</span> (a kinevezéssel). Feladata: a tagok érdekvédelme, a <span class="os-kulcs">hivatásetikai részletszabályok</span> megalkotása, az etikai eljárás rendszerének kialakítása és lefolytatása.</li></ul></div></div></article><article class="os-tetel"><div class="os-tetel-fej"><div class="os-tetel-kod">Á/30.</div><div class="os-tetel-cim">Az új közmenedzsment (NPM)</div></div><div class="os-tetel-body"><div class="os-szek"><div class="os-szek-cim">Előzmény és okok</div><ul class="os-lista"><li>A II. világháború utáni klasszikus közigazgatás → <span class="os-kulcs">jóléti állam</span> → a közigazgatás túlterjeszkedése</li><li>Az NPM (<span class="os-tul">New Public Management</span>) a 80-as évek végétől az ezredfordulóig</li><li>Okok: elégedetlenség a jóléti állammal, a <span class="os-kulcs">magánszféra hatékonyabb</span> szemlélet, recesszió, megszorítások</li></ul></div><div class="os-szek"><div class="os-szek-cim">Cél és eszközök</div><ul class="os-lista"><li>Cél: <span class="os-kulcs">hatékonyság, eredményesség, költségtakarékosság</span>; „olcsó, kicsi állam"</li><li>Eszközök: <span class="os-kulcs">kiszervezés, privatizáció, decentralizáció</span>, piaci mechanizmusok (versenyeztetés, közbeszerzés)</li><li><span class="os-kulcs">Ügynökségek</span> megjelenése; minisztériumok = közpolitika-alkotás, ügynökségek = végrehajtás</li><li>Megjelent az <span class="os-kulcs">egyéni teljesítményértékelés</span>; lazult a pályabiztonság</li></ul></div><div class="os-szek"><div class="os-szek-cim">Kritikák</div><ul class="os-lista"><li>Az állami szféra <span class="os-tul">nem működtethető tisztán piaci mintára</span></li><li>A reformok nem hozták a várt eredményeket; a közérdek a veszteséges feladatok ellátását is megköveteli</li></ul></div><div class="os-szek"><div class="os-szek-cim">10 pontos kérdések</div><ul class="os-lista"><li><strong>37.</strong> A globális közigazgatási reformirányzatok — főbb irányzatok: Public Choice, New Public Administration, <span class="os-kulcs">NPM</span>, <span class="os-kulcs">Good Governance</span>, <span class="os-kulcs">neo-weberi állam</span>. Az NPM (1980-as évek vége–ezredforduló) a piaci viszonyok idealizálásán alapul: „kicsi és olcsó állam", a magánigazgatás módszerei, kiszervezés, privatizáció, teljesítményközpontúság.</li><li><strong>38.</strong> A Good Governance (jó kormányzás) — az utolsó évtized óta; <span class="os-kulcs">hálózatokban gondolkodó</span> kormányzás — az állam, a magánszektor és a <span class="os-kulcs">civil társadalom együttműködése</span>. Szempontjai: részvétel, jogérvényesülés, <span class="os-kulcs">átláthatóság, felelősség</span>, egyetértés, hatékonyság, elszámoltathatóság; széles társadalmi konszenzus.</li><li><strong>39.</strong> A neo-weberi állam és közigazgatás — az NPM kudarcára (2008-as válság) adott válasz; <span class="os-kulcs">megtartja a weberi „régi" közigazgatás</span> életképes elemeit (az állam szerepe, korszerűsített közigazgatási jog), és <span class="os-kulcs">új elemekkel</span> egészíti ki (minőség, szolgáltatási kultúra, professzionalizáció, konzultáció). A klasszikus weberi és az NPM keveréke.</li><li><strong>42.</strong> 10 célkitűzés az ezredforduló utáni közigazgatás-fejlesztésben — pl. <span class="os-kulcs">állampolgárbarát/ügyfélközpontú</span> közigazgatás, a közszolgáltatások színvonalának emelése, a kiadások csökkentése, a <span class="os-kulcs">hatékonyság-eredményesség</span> növelése, a teljesítmény jelentőségének növelése, egyszerűsítés, racionalizálás, <span class="os-kulcs">participáció</span>, elszámoltathatóság-átláthatóság, <span class="os-kulcs">e-közigazgatás</span>.</li><li><strong>44.</strong> A 2010 óta meghirdetett közigazgatás-fejlesztési programok — a <span class="os-kulcs">Magyary Zoltán Közigazgatás-fejlesztési Programok</span> (MP 11.0–2011, MP 12.0–2012). Stratégiai cél: a hatékony nemzeti közigazgatás és a közszolgáltatások színvonala. <span class="os-kulcs">Négy beavatkozási terület</span>: szervezet, feladat, eljárás, személyzet. (Folytatás: a 2014–2020 Közigazgatás- és Közszolgáltatás-fejlesztési Stratégia.)</li></ul></div></div></article><article class="os-tetel"><div class="os-tetel-fej"><div class="os-tetel-kod">Á/31.</div><div class="os-tetel-cim">Az Európai Közigazgatási Tér</div></div><div class="os-tetel-body"><div class="os-szek"><div class="os-szek-cim">A fogalom</div><ul class="os-lista"><li>A 90-es évek második felében: a <span class="os-kulcs">Közös Közigazgatási Tér(ség)</span> fogalma</li><li>A korábbi 15 nyugati EU-tagállam közös értékrendjén alapuló <span class="os-kulcs">ajánlások</span> a belépőknek</li><li>A tagállamok kötelesek az <span class="os-kulcs">uniós vívmányokat (acquis)</span> jog- és intézményrendszerükbe integrálni</li></ul></div><div class="os-szek"><div class="os-szek-cim">Általános követelmények a közigazgatással szemben</div><ul class="os-lista"><li><span class="os-kulcs">Jogbiztonság, felelősség, kiszámíthatóság</span></li><li><span class="os-kulcs">Nyitottság, átláthatóság, felelősségre vonhatóság</span></li><li><span class="os-kulcs">Hatékonyság, hatásosság</span></li></ul></div><div class="os-szek"><div class="os-szek-cim">Európai közigazgatási alapelvek</div><ul class="os-lista"><li><span class="os-kulcs">Megbízhatóság, eredményesség, hatékonyság, kiszámíthatóság</span></li><li><span class="os-kulcs">Stabilitás</span>, hozzáértő professzionális közigazgatás</li><li><span class="os-kulcs">Demokratizmus és pártatlanság, nyilvánosság és átláthatóság</span></li><li>Az <span class="os-kulcs">Európai Bíróság esetjoga</span> alapján: törvényes közigazgatás, arányosság, jogbiztonság, diszkrimináció tilalma, meghallgatás elve</li></ul></div><div class="os-szek"><div class="os-szek-cim">10 pontos kérdések</div><ul class="os-lista"><li><strong>24.</strong> A demokratikus jogállam elvárásai a közigazgatással szemben — két fő alapelv: <span class="os-kulcs">hatékonyság és demokratizmus</span>. A többségi elv a fékek-ellensúlyok mellett; az értékek pluralizmusa. Az OECD „jó kormányzás" vezérelvei: <span class="os-kulcs">átláthatóság-elszámoltathatóság, becsületesség-méltányosság, eredményesség-hatékonyság, jogállamiság</span>. A nyitott közigazgatás a demokrácia alkotóeleme.</li><li><strong>40.</strong> A közigazgatás-fejlesztésben részt vevő nemzetközi szervezetek — az <span class="os-kulcs">adminisztratív konvergencia</span> folyamatában. Típusok: <span class="os-kulcs">globális</span> (OECD, ENSZ, IMF, Világbank), <span class="os-kulcs">regionális</span> (Európa Tanács, EU, EUPAN), <span class="os-kulcs">intézmény</span> (IIAS, EIPA). Az <span class="os-kulcs">OECD</span> helyzetfelméréseket, összehasonlító jelentéseket készít.</li><li><strong>41.</strong> Az EU kötelezettségei a tagállami közigazgatás iránt — kötelező rendelkezés nincs, de a 90-es évek második felében megszületett a <span class="os-kulcs">Közös Közigazgatási Tér</span> fogalma; a tagállamok kötelesek az <span class="os-kulcs">acquis</span>-t integrálni. Európai közigazgatási alapelvek: megbízhatóság, eredményesség, kiszámíthatóság, <span class="os-kulcs">professzionalizmus, pártatlanság, átláthatóság</span>; az Európai Bíróság esetjoga (arányosság, jogbiztonság, meghallgatás).</li></ul></div><div class="os-szek"><div class="os-szek-cim">5 pontos kérdések</div><ul class="os-lista"><li><strong>49.</strong> Miért szükséges a közigazgatás fejlesztése — a gyorsan változó világban a jó állam <span class="os-kulcs">hatékony, takarékos, ügyfélbarát</span> szolgáltatásokat nyújt; az állandó <span class="os-kulcs">modernizáció</span> a gazdasági fejlődés és a feladatellátás feltétele („szolgáltató állam").</li><li><strong>50.</strong> Az adminisztratív konvergencia — a közszolgálatok <span class="os-kulcs">hasonló megoldásokat</span> alkalmaznak és hatnak egymásra; nagyobb <span class="os-kulcs">homogenitás és koherencia</span> jön létre. Az EU-n belül az <span class="os-kulcs">EUPAN</span> segíti; az önálló államok egymás mintáit követik, tapasztalataiból tanulnak.</li><li><strong>51.</strong> A nemzetközi szervezetek szerepe a közigazgatás-fejlesztésben — az adminisztratív konvergencia mozgatói; globális (ENSZ, IMF, Világbank), regionális (EU, Európa Tanács) és intézményi (IIAS, EIPA, <span class="os-kulcs">NISPAcee</span>, EUPAN) szereplők — ajánlások, tapasztalatcsere. Nem kizárólagos profiljuk, de küldetésük része.</li></ul></div></div></article><article class="os-tetel"><div class="os-tetel-fej"><div class="os-tetel-kod">▣</div><div class="os-tetel-cim">Mind a 31 tétel — kulcsfogalom-térkép</div></div><div class="os-tetel-body"><div class="os-szek"><div class="os-szek-cim">Alkotmányos alapok (Á/1—Á/4)</div><ul class="os-lista"><li><span class="os-kulcs">Á/1</span> Hatalommegosztás: Montesquieu 3 ág, 3 forma; átalakulás (partner, nem ellensúly)</li><li><span class="os-kulcs">Á/2</span> Ogy-Kormány: parlamentáris köztársaság, konstruktív bizalmatlanság, ellenőrzés (interpelláció/kérdés)</li><li><span class="os-kulcs">Á/3</span> K.eln.: ellenjegyzés nélküli vs. kötött jogkörök; Ogy feloszlatás (40 nap, márc. 31.)</li><li><span class="os-kulcs">Á/4</span> ÁSZ (12 év, pénzügyi, zárolhat) vs. ombudsman (6 év, ajánlás, bárki kezdeményezheti)</li></ul></div><div class="os-szek"><div class="os-szek-cim">Szervezetrendszer (Á/5—Á/8)</div><ul class="os-lista"><li><span class="os-kulcs">Á/5</span> 2 alrendszer: államigazgatás + önkormányzatok; 4 kapcsolódási pont</li><li><span class="os-kulcs">Á/6</span> Decentralizált (önálló, választott, köztisztviselő) vs. dekoncentrált (kirendeltség, kinevezett, kormánytisztviselő)</li><li><span class="os-kulcs">Á/7</span> Szervek: tipikus (Kormány, minisztérium, kp. hivatal, korm.főhivatal, területi) + atipikus (autonóm, önálló szabályozó); civil vs. rendészeti</li><li><span class="os-kulcs">Á/8</span> Irányítás (legteljesebb) > felügyelet > ellenőrzés; szakmai/szervezet/teljes irányítás; hatáskörelvonás tilalma</li></ul></div><div class="os-szek"><div class="os-szek-cim">Kormány és szervei (Á/9—Á/15)</div><ul class="os-lista"><li><span class="os-kulcs">Á/9</span> Kormány: ált. hatáskörű szerv, kettős funkció, miniszterelnök kiemelkedő szerepe</li><li><span class="os-kulcs">Á/10-11</span> Kormányülés (testületi, mineln. vezeti) + előkészítés (KÁT)</li><li><span class="os-kulcs">Á/12-13</span> Kormánybiztos (egyszemélyi, max. 4 év) vs. segédszervek (kabinet, kormánybizottság — testületi)</li><li><span class="os-kulcs">Á/14-15</span> Minisztérium (politikai: miniszter, államtitkár; szakmai: közig. áll.titkár, helyettes áll.titkár) + Miniszterelnökség</li></ul></div><div class="os-szek"><div class="os-szek-cim">Területi igazgatás és funkciók (Á/16—Á/22)</div><ul class="os-lista"><li><span class="os-kulcs">Á/16</span> Önkorm. államig. feladatok: delegált, jegyző, csak törvény + támogatás</li><li><span class="os-kulcs">Á/17-18</span> Kormányhivatal (főispán, főigazgató) + járási hivatal (kormányablakok)</li><li><span class="os-kulcs">Á/19-20</span> Közig. alapfunkciók (állandó/változó, POSDCORB) + tevékenységfajták (jogalkotás, jogalkalmazás, felügyelet)</li><li><span class="os-kulcs">Á/21</span> Hatósági felügyelet: speciális (ex lege) / általános / törvényességi (nem hatósági!)</li><li><span class="os-kulcs">Á/22</span> Nemzeti vagyon 4 kategória: forgalomképtelen / kiemelt / korlátozottan forgalomképes / üzleti</li></ul></div><div class="os-szek"><div class="os-szek-cim">Személyzet, felelősség, reform (Á/23—Á/31)</div><ul class="os-lista"><li><span class="os-kulcs">Á/23</span> SZMSZ: belső szabályzat, jogszabályi felhatalmazás, irányító hagyja jóvá</li><li><span class="os-kulcs">Á/24-25</span> Zárt rendszer (élethivatás, karrier, elmozdíthatatlanság) vs. nyitott (zsákmányrendszer, fluktuáció)</li><li><span class="os-kulcs">Á/26</span> Személyzeti politika 7 korszaka 1867-től</li><li><span class="os-kulcs">Á/27-29</span> Felelősség: fegyelmi, kártérítési, + vezetői eredményfelelősség (nem jogsértéshez kötött)</li><li><span class="os-kulcs">Á/30</span> NPM: 80-as évek vége, piaci minta, ügynökségek, kritikák</li><li><span class="os-kulcs">Á/31</span> Európai Közigazgatási Tér: acquis integrálása, közigazgatási alapelvek</li></ul></div></div></article><div class="os-tanacs"><div class="os-tanacs-cim">Szombati ismétlési tanács</div><div class="os-tanacs-szov">Vasárnap pihenés, hétfőn (nov. 9.) teljes önellenőrzés és a gyenge pontok pótlása. <strong>Kedden (nov. 10.) a vizsga — sok sikert!</strong></div></div>';

var NAPOK=[
 {h:1,d:"okt. 19. (H)",m:1,t:["Á/1","Á/2"],tip:"tan",tipp:1,tippmegj:"<p>A nyitó nap két alapozó tétellel, amelyek <strong>egymásra épülnek</strong>: előbb az elmélet (hatalommegosztás), majd ennek magyar gyakorlati leképezése (Ogy–Kormány viszony). Érdemes folyamatként kezelni őket.</p><div class=\"tipp-tetel\"><span class=\"tipp-tetel-kod\">Á/1</span> — <strong>A hatalommegosztás átalakulása</strong>: elméleti, történeti ív — a szerzőkre figyelj: Arisztotelész → Locke (törvényhozó, végrehajtó, föderatív) → Montesquieu (3 ág) → Benjamin Constant (államfői/semleges hatalom). A 3 alapforma: klasszikus (USA), kétkamarás törvényhozás, föderalizmus. Az átalakulás lényege: a modern parlamentáris rendszerben a törvényhozás nem ellensúly, hanem partner — az egyensúlyt semleges szervek (ÁSZ, ombudsman, AB) adják.</div><div class=\"tipp-tetel\"><span class=\"tipp-tetel-kod\">Á/2</span> — <strong>Az Országgyűlés és a Kormány viszonya</strong>: a parlamentáris köztársaság lényege: a Kormány az Ogynek felelős, bírnia kell a bizalmát. Kulcsfogalmak: konstruktív bizalmatlanság, bizalmi szavazás. Az Ogy ellenőrző eszközei: interpelláció (van viszontválasz) vs. kérdés (nincs).</div><div class=\"tipp-figyelj\"><strong>⚠ Amire figyelj:</strong> Az interpelláció és a kérdés különbsége (viszontválasz van-e) tipikus kérdés. A Kormány <strong>nem oszlathatja fel</strong> az Ogyt.</div>"},
 {h:1,d:"okt. 20. (K)",m:1,t:["Á/3","Á/4"],tip:"tan",tipp:1,tippmegj:"<p>A semleges hatalmi szervek napja: a köztársasági elnök és a két parlamenti ellenőrző szerv. Az Á/3 az államfői egyensúlyozó szerepet, az Á/4 a pénzügyi és alapjogi kontrollt mutatja be.</p><div class=\"tipp-tetel\"><span class=\"tipp-tetel-kod\">Á/3</span> — <strong>A köztársasági elnök és a Kormány</strong>: az ellenjegyzés a tengely: válaszd szét az ellenjegyzéshez NEM kötött (önálló) és a kötött jogköröket. Az Ogy feloszlatásának 2 esete: a javasolt miniszterelnököt 40 napon belül nem választják meg, vagy márc. 31-ig nincs költségvetés (ex lex).</div><div class=\"tipp-tetel\"><span class=\"tipp-tetel-kod\">Á/4</span> — <strong>ÁSZ és az alapvető jogok biztosa</strong>: kétoszlopos összevetés: ÁSZ (pénzügyi-gazdasági, 12 év, zárolhat, akadályozása bűncselekmény) vs. ombudsman (alapjogvédelem, 6 év, bárki kezdeményezheti, érdemi intézkedési joga nincs — csak ajánlás).</div><div class=\"tipp-figyelj\"><strong>⚠ Amire figyelj:</strong> Az ombudsmannak <strong>nincs érdemi intézkedési jogköre</strong> — csak ajánlást tesz, eljárást kezdeményez, nyilvánosságra hoz. Az ÁSZ ezzel szemben zárolhat.</div>"},
 {h:1,d:"okt. 21. (Sze)",m:2,t:["Á/5","Á/6"],tip:"tan",tipp:1,tippmegj:"<p>A közigazgatás szerkezetének alapfogalmai. Az Á/5 a két nagy alrendszert, az Á/6 a centralizáció-decentralizáció tengelyt mutatja be — a kettő összefügg.</p><div class=\"tipp-tetel\"><span class=\"tipp-tetel-kod\">Á/5</span> — <strong>A magyar közigazgatás alrendszerei</strong>: 2 alrendszer: államigazgatás (országos ügyek, az állam felel) + helyi önkormányzatok (helyi közügyek, választott szervek). A 4 kapcsolódási pont: törvényességi felügyelet, delegált államigazgatási feladatok, területszervezés, véleményezési jog.</div><div class=\"tipp-tetel\"><span class=\"tipp-tetel-kod\">Á/6</span> — <strong>Decentralizált és dekoncentrált szervek</strong>: élesen állítsd szembe: dekoncentrált = centralizált rendszer kirendeltsége, kinevezett vezető, hierarchikus alárendeltség, kormánytisztviselő. Decentralizált = önálló, választott vezető, autonómia, köztisztviselő (területi → önkormányzat, funkcionális → kórház, iskola).</div><div class=\"tipp-figyelj\"><strong>⚠ Amire figyelj:</strong> A dekoncentrált (kormánytisztviselő, kinevezett) vs. decentralizált (köztisztviselő, választott) elhatárolás a tétel magja — kétoszlopos táblát készíts.</div>"},
 {h:1,d:"okt. 22. (Cs)",m:2,t:["Á/7","Á/8"],tip:"tan",tipp:1,tippmegj:"<p>A szervezetrendszer és az irányítás. Az Á/7 a szervtípusokat rendszerezi, az Á/8 az irányítás-felügyelet-ellenőrzés viszonyt — mindkettő erősen fogalom-alapú.</p><div class=\"tipp-tetel\"><span class=\"tipp-tetel-kod\">Á/7</span> — <strong>Az államigazgatási szervek csoportosítása</strong>: tipikus szervek (Kormány, minisztérium, központi hivatal, kormányzati főhivatal, területi szervek) + atipikus szervek (autonóm államigazgatási, önálló szabályozó — pl. NMHH, MEKH, SZTFH). Másik tengely: civil (kormány-/köztisztviselő) vs. rendészeti (hivatásos szolgálati jogviszony).</div><div class=\"tipp-tetel\"><span class=\"tipp-tetel-kod\">Á/8</span> — <strong>Az irányítás</strong>: az irányítás a legintenzívebb akaratérvényesítés; eszközei (alapítás, vezetőkinevezés, ellenőrzés, egyedi utasítás). Fajtái: szakmai / szervezet / teljes irányítás. Korlátja a hatáskörelvonás tilalma.</div><div class=\"tipp-figyelj\"><strong>⚠ Amire figyelj:</strong> Az irányítás > felügyelet > ellenőrzés intenzitási sorrendet tartsd fejben. A felügyelet kevesebb rendelkezési joggal jár, mint az irányítás.</div>"},
 {h:1,d:"okt. 23. (P)",m:3,t:["Á/9","Á/10","Á/11"],tip:"tan",hosszu:1,tipp:1,tippmegj:"<p><strong>Hosszú nap</strong>, három összefüggő tétel a Kormányról: fogalom → működés → előkészítés. Kezeld <strong>egyetlen folyamatként</strong> — a Kormány „életét\" követed végig. Számolj 3 órával, tarts több szünetet.</p><div class=\"tipp-tetel\"><span class=\"tipp-tetel-kod\">Á/9</span> — <strong>A Kormány fogalma, funkciói</strong>: az államigazgatás általános hatáskörű szerve; kettős funkció (kormányzati + közigazgatási). A miniszterelnök kiemelkedő szerepe: ő határozza meg az általános politikát, a Kormány megbízatása az ő megbízatásához kötött.</div><div class=\"tipp-tetel\"><span class=\"tipp-tetel-kod\">Á/10</span> — <strong>A Kormány működése</strong>: testületi szervként, kormányüléseken működik; a miniszterelnök vezeti. A döntés formái: rendelet, határozat, irányelv, elvi állásfoglalás.</div><div class=\"tipp-tetel\"><span class=\"tipp-tetel-kod\">Á/11</span> — <strong>A kormányülés előkészítése; KÁT</strong>: a közigazgatási egyeztetés + a Közigazgatási Államtitkári Értekezlet (KÁT), amely minden előterjesztést előzetesen megtárgyal. Tagjai a közigazgatási államtitkárok.</div><div class=\"tipp-figyelj\"><strong>⚠ Amire figyelj:</strong> A három tétel egy ívet ad: ne külön magold őket, hanem mondd el a Kormány „útját\" a megalakulástól a döntéshozatalig.</div>"},
 {h:1,d:"okt. 24. (Szo)",m:1,t:[],tip:"ism",tema:"Ismétlés — 1. hét anyaga · Á/1—Á/11 összefoglaló",osszef:"h1"},
 {h:1,d:"okt. 25. (V)",m:0,t:[],tip:"pih",tema:"Pihenőnap — kötelező kikapcsolódás"},
 {h:2,d:"okt. 26. (H)",m:3,t:["Á/12","Á/13"],tip:"tan",tipp:1,tippmegj:"<p>A Kormány segédszervei. Az Á/12 a kormánybiztost önállóan, az Á/13 a többi segédszerv kontextusában mutatja be — sok az átfedés, kezeld őket együtt.</p><div class=\"tipp-tetel\"><span class=\"tipp-tetel-kod\">Á/12</span> — <strong>A kormánybiztos</strong>: egyszemélyi segédszerv; a Kormány nevezi ki normatív határozattal, max. 4 évre; a Kormány helyett és nevében jár el. Rokon: miniszterelnöki biztos, miniszterelnöki megbízott.</div><div class=\"tipp-tetel\"><span class=\"tipp-tetel-kod\">Á/13</span> — <strong>Kormánybiztos és a többi segédszerv</strong>: a kabinet (koordináció, állásfoglalás, nem dönt a Kormány helyett — 4 kabinet) és a kormánybizottság (több ágazatot érintő ügyek). A kulcskülönbség: a kormánybiztos egyszemélyi, a kabinet és kormánybizottság testületi.</div><div class=\"tipp-figyelj\"><strong>⚠ Amire figyelj:</strong> Egyszemélyi (kormánybiztos) vs. testületi (kabinet, kormánybizottság) — ez a leggyakoribb elhatárolási kérdés.</div>"},
 {h:2,d:"okt. 27. (K)",m:3,t:["Á/14","Á/15"],tip:"tan",tipp:1,tippmegj:"<p>A minisztérium belső világa és a Miniszterelnökség. Az Á/14 a vezetési struktúra (politikai vs. szakmai vezetők), ez a tétel magja.</p><div class=\"tipp-tetel\"><span class=\"tipp-tetel-kod\">Á/14</span> — <strong>A minisztérium vezetési struktúrája</strong>: élesen válaszd szét a politikai vezetőket (miniszter, államtitkár) és a szakmai vezetőket (közigazgatási államtitkár, helyettes államtitkár). A belső felépítés: főosztály → osztály.</div><div class=\"tipp-tetel\"><span class=\"tipp-tetel-kod\">Á/15</span> — <strong>A Miniszterelnökség</strong>: a miniszterelnök munkaszervezete, élén a Miniszterelnökséget vezető miniszter; feladata a kormányzati koordináció és a miniszterelnök támogatása.</div><div class=\"tipp-figyelj\"><strong>⚠ Amire figyelj:</strong> A politikai (miniszter, államtitkár) vs. szakmai (közig. államtitkár, helyettes államtitkár) vezetők elhatárolása a vizsga kedvence — pontosan tudd, ki melyik.</div>"},
 {h:2,d:"okt. 28. (Sze)",m:4,t:["Á/16","Á/17"],tip:"tan",tipp:1,tippmegj:"<p>A területi és helyi államigazgatás. Az Á/16 az önkormányzatok delegált feladatait, az Á/17 a kormányhivatalt mutatja be.</p><div class=\"tipp-tetel\"><span class=\"tipp-tetel-kod\">Á/16</span> — <strong>Önkormányzati államigazgatási feladatok</strong>: a delegált (átruházott) feladatok; e körben a testület utasítást nem adhat, a döntést nem bírálhatja felül. Államigazgatási feladatot csak törvény állapíthat meg, arányos támogatással. A jegyző látja el a zömét.</div><div class=\"tipp-tetel\"><span class=\"tipp-tetel-kod\">Á/17</span> — <strong>A kormányhivatal</strong>: vezetés: főispán (politikai) + főigazgató (szakmai) + igazgató. A járási hivatalok a kormányhivatal szervezeti egységei. Feladatok: hatósági ügyek, önkormányzatok törvényességi felügyelete, koordináció.</div><div class=\"tipp-figyelj\"><strong>⚠ Amire figyelj:</strong> A kormányhivatal vezetője a <strong>főispán</strong> (a korábbi „kormánymegbízott\" helyett) — a jegyzet erre épít.</div>"},
 {h:2,d:"okt. 29. (Cs)",m:4,t:["Á/18","Á/19"],tip:"tan",tipp:1,tippmegj:"<p>A legalsó területi szint és a közigazgatás funkciói. Két eltérő tétel — kezeld őket külön.</p><div class=\"tipp-tetel\"><span class=\"tipp-tetel-kod\">Á/18</span> — <strong>A járási hivatal</strong>: a kormányhivatal szervezeti egysége (kirendeltsége), a legalsó szintű általános hatáskörű területi államigazgatási szerv; hivatalvezető vezeti. A kormányablakok (integrált ügyfélszolgálat) működtetése.</div><div class=\"tipp-tetel\"><span class=\"tipp-tetel-kod\">Á/19</span> — <strong>A közigazgatás alapfunkciói</strong>: állandó (a közigazgatás létéből fakadó) vs. változó funkciók. A feladatfelmérés módszertani kérdés; POSDCORB (Gulick 7 eleme) és a hatékony igazgatás modellje.</div><div class=\"tipp-figyelj\"><strong>⚠ Amire figyelj:</strong> A POSDCORB hét elemét (Planning, Organizing, Staffing, Directing, Coordinating, Reporting, Budgeting) érdemes fejből tudni.</div>"},
 {h:2,d:"okt. 30. (P)",m:4,t:["Á/20","Á/21","Á/22"],tip:"tan",hosszu:1,tipp:1,tippmegj:"<p><strong>Hosszú nap</strong>, három eltérő tétel — itt <strong>nincs közös ív</strong>, kezeld őket külön lapra, és súlyozz a kérdésszám szerint. Számolj 3 órával.</p><div class=\"tipp-tetel\"><span class=\"tipp-tetel-kod\">Á/20</span> — <strong>Államigazgatási tevékenységfajták</strong>: jogalkotó tevékenység, hatósági jogalkalmazás, hatósági felügyelet, szervező-szolgáltató tevékenység. Fontos elhatárolások: hatáskör vs. feladatkör, a kiadmányozás (aláírási jog), a hatáskör-átruházás és szubdelegálás tilalma.</div><div class=\"tipp-tetel\"><span class=\"tipp-tetel-kod\">Á/21</span> — <strong>A hatósági felügyelet típusai</strong>: 3 típus: speciális (ex lege, felügyeleti szervek), általános (a jogalkalmazó ellenőrzi saját aktusa követését), törvényességi (köztestületek felett — NEM hatósági felügyelet!).</div><div class=\"tipp-tetel\"><span class=\"tipp-tetel-kod\">Á/22</span> — <strong>A nemzeti vagyon</strong>: 4 kategória: forgalomképtelen / nemzetgazdaságilag kiemelt / korlátozottan forgalomképes / üzleti. Rendeltetés szerint: kincstári vagyon vs. üzleti vagyon.</div><div class=\"tipp-figyelj\"><strong>⚠ Amire figyelj:</strong> A törvényességi felügyelet <strong>nem</strong> hatósági felügyelet, és alanya soha nem lehet magánszemély. A nemzeti vagyon 4 kategóriáját külön lapra vázold.</div>"},
 {h:2,d:"okt. 31. (Szo)",m:4,t:[],tip:"ism",tema:"Ismétlés — 2. hét anyaga · Á/12—Á/22 összefoglaló",osszef:"h2"},
 {h:2,d:"nov. 1. (V)",m:0,t:[],tip:"pih",tema:"Pihenőnap — kötelező kikapcsolódás"},
 {h:3,d:"nov. 2. (H)",m:5,t:["Á/23","Á/24"],tip:"tan",tipp:1,tippmegj:"<p>A működés szabályozása és a személyzeti politika kezdete. Az Á/24 (zárt rendszer) az érdemibb és kérdezettebb.</p><div class=\"tipp-tetel\"><span class=\"tipp-tetel-kod\">Á/23</span> — <strong>A szervezeti és működési szabályzat</strong>: belső szabályzat, jogszabályi felhatalmazás alapján (közjogi szervezetszabályozó eszköz, normatív utasítás). Tartalma: jogállás, feladat-hatáskör, szervezeti felépítés, működés rendje. Az irányító/felügyeleti szerv hagyja jóvá.</div><div class=\"tipp-tetel\"><span class=\"tipp-tetel-kod\">Á/24</span> — <strong>Zárt rendszerű személyzeti politika</strong>: központilag irányított, egységes pragmatika; a munka élethivatás (élethossziglan); 2 alappillér: kiválasztás + karrier(rendszer); elmozdíthatatlanság elve; az előmenetel alapja a szolgálati idő + iskolai végzettség; kötött díjazás.</div><div class=\"tipp-figyelj\"><strong>⚠ Amire figyelj:</strong> A zárt rendszer az „élethivatás + karrier + elmozdíthatatlanság\" hármason áll — holnap a nyitott rendszerrel állítod majd szembe.</div>"},
 {h:3,d:"nov. 3. (K)",m:5,t:["Á/25","Á/26"],tip:"tan",tipp:1,tippmegj:"<p>A nyitott rendszer és a személyzeti politika története. Az Á/25 közvetlenül kapcsolódik a tegnapi zárt rendszerhez — összehasonlító táblát készíts.</p><div class=\"tipp-tetel\"><span class=\"tipp-tetel-kod\">Á/25</span> — <strong>Nyitott rendszerű személyzeti politika</strong>: a magánigazgatáshoz hasonló: korlátozás nélküli belépés és egyoldalú megszüntetés; meghatározott feladatra szerződtetés; politikai szempontú kiválasztás lehetséges (USA: „zsákmányrendszer\"); nagy fluktuáció; teljesítményfüggő díjazás.</div><div class=\"tipp-tetel\"><span class=\"tipp-tetel-kod\">Á/26</span> — <strong>Személyzeti politika fejlődése 1867-től</strong>: 7 korszak időrendje: 1867 (kiegyezés, nyitottság) → 1914 (korszerű zárt rendszer) → 1945 (zsákmányrendszer) → 1945–49 (pártszempontok) → 1949 (államigazgatási, párthűség) → 1957–89 (konszolidáció) → 1992 (demokratikus újjáépítés).</div><div class=\"tipp-figyelj\"><strong>⚠ Amire figyelj:</strong> A zárt (Á/24) vs. nyitott (Á/25) rendszer szembeállítása a leggyakoribb kérdés — a kétoszlopos tábla mentén tudsz a vizsgán érvelni.</div>"},
 {h:3,d:"nov. 4. (Sze)",m:5,t:["Á/27","Á/28"],tip:"tan",tipp:1,tippmegj:"<p>A felelősségi alakzatok első két fajtája. Mindkettő vétkességhez kötött jogi felelősség — a különbség a tárgyban van.</p><div class=\"tipp-tetel\"><span class=\"tipp-tetel-kod\">Á/27</span> — <strong>A fegyelmi felelősség</strong>: a jogviszonyból eredő kötelezettség vétkes megszegése; fegyelmi eljárás; büntetések sorrendje: megrovás → várakozási idő meghosszabbítása → fizetési fokozatban visszavetés → hivatalvesztés.</div><div class=\"tipp-tetel\"><span class=\"tipp-tetel-kod\">Á/28</span> — <strong>A kárfelelősség</strong>: feltételei: kötelezettségszegés + kár + okozati összefüggés + vétkesség. Gondatlan (korlátozott) vs. szándékos (teljes) károkozás; megőrzési és leltárhiány-felelősség; kimentés vis maior esetén.</div><div class=\"tipp-figyelj\"><strong>⚠ Amire figyelj:</strong> A fegyelmi büntetések sorrendjét (a megrovástól a hivatalvesztésig) és a gondatlan/szándékos károkozás eltérő mértékét pontosan tudd.</div>"},
 {h:3,d:"nov. 5. (Cs)",m:5,t:["Á/29","Á/30"],tip:"tan",tipp:1,tippmegj:"<p>A vezetői felelősség és a reformirányzat. Az Á/29 a felelősségi alakzatokat zárja, az Á/30 (NPM) új témakört nyit.</p><div class=\"tipp-tetel\"><span class=\"tipp-tetel-kod\">Á/29</span> — <strong>A vezetői eredményfelelősség</strong>: a vezető a szervezeti egysége eredményességéért felel — NEM feltétlenül jogsértés alapján. Állítsd szembe a jogi felelősséggel (jogsértéshez kötött, szankcióval jár). A 4 jogi felelősségi alakzat: fegyelmi, kártérítési, büntetőjogi, etikai.</div><div class=\"tipp-tetel\"><span class=\"tipp-tetel-kod\">Á/30</span> — <strong>Az új közmenedzsment (NPM)</strong>: a jóléti állam túlterjeszkedésére adott válasz (80-as évek vége–ezredforduló); cél a hatékonyság, „olcsó, kicsi állam\"; eszközök: kiszervezés, privatizáció, ügynökségek, teljesítményértékelés. Kritikák: az állam nem működtethető tisztán piaci mintára.</div><div class=\"tipp-figyelj\"><strong>⚠ Amire figyelj:</strong> Az eredményfelelősség NEM jogsértéshez kötött — ez különbözteti meg a 4 jogi felelősségi alakzattól. Ezt emeld ki.</div>"},
 {h:3,d:"nov. 6. (P)",m:5,t:["Á/31"],tip:"tan",tipp:1,tippmegj:"<p>Az utolsó tanulós tétel: az Európai Közigazgatási Tér. A felkészülés tartalmi zárása — van időd alaposan, és érdemes a teljes anyagra is visszatekinteni.</p><div class=\"tipp-tetel\"><span class=\"tipp-tetel-kod\">Á/31</span> — <strong>Az Európai Közigazgatási Tér</strong>: a 90-es évek második fele; a tagállamok kötelesek az uniós vívmányokat (acquis) integrálni. Az általános követelmények (jogbiztonság, nyitottság-átláthatóság, hatékonyság) és az európai közigazgatási alapelvek (megbízhatóság, pártatlanság, az Európai Bíróság esetjoga: arányosság, jogbiztonság, meghallgatás elve).</div><div class=\"tipp-figyelj\"><strong>⚠ Amire figyelj:</strong> Ez az utolsó új tétel — utána már csak ismétlés jön. Szánj a végén időt arra, hogy a 31 tételt egészben is átfusd fejben.</div>"},

var ALTRITMUS='<div class="tipp-szakasz-cim">Általános napi ritmus (~2-3 óra)</div><ul class="tipp-lepesek"><li><span class="tipp-lepes-cim">Ráhangolódás<span class="tipp-ido">~10 perc</span></span><br>Nyisd meg a tétel(eke)t, és olvasd át <em>csak a kérdéseket</em> — a 15, 10 és 5 pontosakat is. Így előre látod, hová fut ki a téma.</li><li><span class="tipp-lepes-cim">Megértő átolvasás<span class="tipp-ido">~25-30 perc</span></span><br>Olvasd át a jegyzetet egyszer, végig, <em>jegyzetelés nélkül</em>. A cél nem a rögzítés, hanem a logikai ív és az ok-okozat megértése.</li><li><span class="tipp-lepes-cim">Saját vázlat fejből<span class="tipp-ido">~30 perc</span></span><br>Csukd be a jegyzetet, és <em>fejből</em> vázolj papírra (kulcsszavak, fogalmak, törvényszámok). Aztán nyisd ki, és egészítsd ki, ami kimaradt. Ez lesz a szombati ismétlés alapanyaga — ne dobd el!</li><li><span class="tipp-lepes-cim">A 10 és 5 pontos kérdések<span class="tipp-ido">~30 perc</span></span><br>Ezek a fő tételhez <em>csatolt</em> kiegészítések. Mindegyikhez elég egy-két mondatos vázlatpont. Figyelj a pontos megnevezésekre, számokra és törvényszámokra — írásban ezek értéket érnek.</li><li><span class="tipp-lepes-cim">Hangos önellenőrzés<span class="tipp-ido">~25 perc</span></span><br>Tegyél félre mindent, és mondd el <em>hangosan</em>, mintha vizsgáztatnád magad. Ahol megakadsz — és csak ott — nézz vissza. Ismételd, amíg gördülékenyen megy.</li><li><span class="tipp-lepes-cim">Rövid írásgyakorlás<span class="tipp-ido">~15 perc</span></span><br>Zárd a napot egy mini-próbával: 15 perc alatt írd le vázlatosan a 15 pontos kérdés válaszát, ahogy a vizsgán tennéd. Utána vesd össze a jegyzettel — mi maradt ki?</li></ul><div class="tipp-lab">A 2-3 órát ne egyben told végig: kb. 45-50 percenként tarts 5-10 perc szünetet. A cél a megértés és egy használható vázlat, nem a szó szerinti tudás — azt az ismétlések építik fel.</div>';
var ONRITMUS='<div class="tipp-szakasz-cim">Záró önellenőrzés ritmusa (~2-3 óra)</div><ul class="tipp-lepesek"><li><span class="tipp-lepes-cim">Ne olvass új anyagot</span><br>Ma nem tanulsz, hanem <em>visszakérdezel</em>. Vedd elő a 3 hét alatt készített saját vázlataidat.</li><li><span class="tipp-lepes-cim">Hangos felidézés tételenként</span><br>Mind a 31 tételt fusd át <em>fejből, hangosan</em> — mintha a vizsgáztatónak magyaráznál. Csak akkor lapozz a jegyzethez, ha elakadsz.</li><li><span class="tipp-lepes-cim">A gyenge pontok pótlása</span><br>Amelyik tételnél akadozol, azt jelöld meg, és célzottan nézd át újra. A három szombati összefoglaló kompakt térképe most a fő referenciád.</li><li><span class="tipp-lepes-cim">Korai lefekvés</span><br>Holnap a vizsga — aludj legalább 7-8 órát, egyél könnyű reggelit, és érkezz 15-20 perccel korábban.</li></ul><div class="tipp-lab">Az utolsó nap nem a bemagolásé, hanem a megnyugvásé. Aki idáig követte a tanmenetet, annak a tudás már a fejében van — most a felidézés gördülékenységét csiszolod.</div>';

var KERDESSOR_AI_BASE="https://kissati84.github.io/szakvizsga-kerdessor-valszthato/";
var KERDESSOR_AI_FO="kerdessor_allamigazgatas_2026.html";
var KERDESSOR_AI_PROBA="probateszt_allamigazgatas_2026.html";

var TN={
  tan:"Új anyag", ism:"Ismétlés", on:"Önellenőrzés",
  vaz:"Vázlat", pot:"Pótlás", pih:"Pihenő",
  un:"Ünnep", viz:"Vizsga"
};

var MNEV={0:"Ismétlés / Záró",1:"Alkotmányos alapok",2:"Szervezetrendszer",3:"Kormány és szervei",4:"Területi igazgatás",5:"Személyzet és reform"};

// Csoportosítás hetek szerint

// ═══════════ BŐVÍTÉSEK: tárolás, dátum ═══════════
var TANMENET_ID="AI";
var STORE=(function(){
  var mem={};
  var has=(function(){try{var k="__t_"+Math.random();localStorage.setItem(k,"1");localStorage.removeItem(k);return true;}catch(e){return false;}})();
  return {
    get:function(k){ if(has){try{return localStorage.getItem(k);}catch(e){}} return (k in mem)?mem[k]:null; },
    set:function(k,v){ if(has){try{localStorage.setItem(k,v);return;}catch(e){}} mem[k]=v; }
  };
})();
function keszKulcs(d){ return TANMENET_ID+":kesz:"+d; }
function keszE(d){ return STORE.get(keszKulcs(d))==="1"; }
function keszSet(d,v){ STORE.set(keszKulcs(d), v?"1":"0"); }
var HONAP={'jan':0,'feb':1,'febr':1,'már':2,'márc':2,'ápr':3,'máj':4,'jún':5,'júl':6,'aug':7,'szept':8,'okt':9,'nov':10,'dec':11};
function napDatum(d){var m=d.match(/^([a-záéíóöőúüű]+)\.\s*(\d+)\./i);if(!m)return null;var h=HONAP[m[1].toLowerCase()];if(h===undefined)return null;return new Date(2026,h,parseInt(m[2],10));}
function maMidnight(){var t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate());}
function azonosNap(a,b){return !!a&&!!b&&a.getTime()===b.getTime();}

var hetek={};
NAPOK.forEach(function(n){
  if(!hetek[n.h]) hetek[n.h]=[];
  hetek[n.h].push(n);
});
var hl=Object.keys(hetek).map(Number).sort(function(a,b){return a-b;});

// Tétel → hely map + kereső index
var TETEL_HELY={}, KERESO_INDEX=[];
hl.forEach(function(h){
  hetek[h].forEach(function(nap, idx){
    (nap.t||[]).forEach(function(kod){
      TETEL_HELY[kod]={h:h, idx:idx};
      var te=T[kod];
      if(te){
        KERESO_INDEX.push({kod:kod, cim:te.c, h:h, idx:idx, nap:nap.d,
          szoveg:(te.c+" "+(te.k15||[]).join(" ")+" "+(te.k10||[]).join(" ")+" "+(te.k5||[]).join(" ")).toLowerCase()});
      }
    });
  });
});
// Ma napja + aktív hét
var MA=maMidnight(), MA_NAP=null, AKTIV_HET=hl[0];
(function(){
  var elso=null, utolso=null, talalt=false;
  hl.forEach(function(h){ hetek[h].forEach(function(nap){
    var dt=napDatum(nap.d); if(!dt) return;
    if(!elso) elso=dt; utolso=dt;
    if(azonosNap(dt,MA)){ MA_NAP=nap.d; AKTIV_HET=h; talalt=true; }
  });});
  if(!talalt){
    if(elso && MA<elso) AKTIV_HET=hl[0];
    else if(utolso && MA>utolso) AKTIV_HET=hl[hl.length-1];
  }
})();
function haladoFrissit(){
  var ossz=0, kesz=0;
  NAPOK.forEach(function(nap){
    if(["tan","on","ism","vaz","pot"].indexOf(nap.tip)>-1){ ossz++; if(keszE(nap.d)) kesz++; }
  });
  var szE=document.getElementById("haladoSzam"), oE=document.getElementById("haladoOssz"), kE=document.getElementById("haladoKitolt");
  if(szE) szE.textContent=kesz;
  if(oE) oE.textContent=ossz;
  if(kE) kE.style.width=(ossz?Math.round(kesz/ossz*100):0)+"%";
}


// Navigációs gombok
var nav=document.getElementById("navBar");
var fo=document.getElementById("fo");

hl.forEach(function(h){
  var btn=document.createElement("button");
  btn.className="nav-gomb";
  btn.id="b"+h;
  btn.textContent=h+". hét";
  btn.onclick=function(){show(h);};
  nav.appendChild(btn);
});

function show(h){
  document.querySelectorAll(".nav-gomb").forEach(function(b){b.classList.remove("on");});
  document.getElementById("b"+h).classList.add("on");
  fo.innerHTML="";
  var ns=hetek[h];

  // Napi al-navigáció építése
  var napNav=document.getElementById("napNav");
  napNav.innerHTML='<div class="nap-nav-cim">'+h+'. hét napjai</div>';
  ns.forEach(function(nap,idx){
    var ng=document.createElement("button");
    ng.className="nap-gomb nap-gomb-mod"+nap.m;
    var isSzo=nap.d.indexOf("Szo")>-1;
    var isUn=nap.tip==="un"||nap.tip==="pih";
    var isViz=nap.tip==="viz";
    if(isSzo) ng.classList.add("szombat");
    if(isUn) ng.classList.add("unnep");
    if(isViz) ng.classList.add("vizsga");
    var dParts=nap.d.match(/^([a-záéíóöőúüű]+)\.\s*(\d+)\.\s*\(([A-Za-zóöőúüű]+)\)/i);
    var rovidMap={"H":"Hétfő","K":"Kedd","Sze":"Szerda","Cs":"Csütörtök","P":"Péntek","Szo":"Szombat"};
    var hnap=dParts?(rovidMap[dParts[3]]||dParts[3]):"";
    var teljes=dParts?(hnap+" · "+dParts[1]+". "+dParts[2]+"."):nap.d;
    ng.innerHTML='<span class="nap-gomb-pont"></span><span>'+teljes+'</span>';
    ng.onclick=function(){ugrasNapra(h,idx);};
    napNav.appendChild(ng);
  });


  // Heti fejléc
  var d1=ns[0].d.split("(")[0].trim();
  var dl=ns[ns.length-1].d.split("(")[0].trim();
  var mset={};
  ns.forEach(function(n){ if(n.m>0) mset[n.m]=1; });
  var mlbl=Object.keys(mset).map(function(m){return MNEV[m];}).join(" + ")||"Összefoglaló ismétlés";

  var hf=document.createElement("div");
  hf.className="het-fejlec";
  hf.innerHTML='<div class="het-szam-nagy">'+h+'.</div>'+
    '<div class="het-info">'+
      '<div class="het-cim">'+mlbl+'</div>'+
      '<div class="het-datum">'+d1+' — '+dl+' · '+ns.length+' nap</div>'+
    '</div>';
  fo.appendChild(hf);

  // Napok
  ns.forEach(function(nap){
    var nk=0;
    nap.t.forEach(function(k){
      var te=T[k]; if(te) nk+=te.k15.length+te.k10.length+te.k5.length;
    });

    var isSzo=nap.d.indexOf("Szo")>-1;
    var isUn=nap.tip==="un";
    var isViz=nap.tip==="viz";
    var isPih=nap.tip==="pih";

    var napDiv=document.createElement("article");
    napDiv.className="nap m"+nap.m;
    napDiv.setAttribute("data-nap", nap.d);
    if(MA_NAP===nap.d) napDiv.classList.add("ma-nap");
    if(keszE(nap.d)) napDiv.classList.add("kesz");
    if(isSzo) napDiv.classList.add("szombat");
    if(isUn||isPih) napDiv.classList.add("unnep");
    if(isViz) napDiv.classList.add("vizsga");

    // Téma — rövid címet kreálunk a tételekhez
    var tema=nap.tema;
    if(!tema && nap.t.length>0){
      if(nap.t.length===1){
        var te=T[nap.t[0]];
        tema=te?te.c:nap.t[0];
      } else {
        tema=nap.t.length+" tétel — "+MNEV[nap.m];
      }
    }
    if(!tema) tema=TN[nap.tip];

    // Datum parts
    var dParts=nap.d.match(/^([a-záéíóöőúüű]+)\.\s*(\d+)\.\s*\(([A-Za-zóöőúüű]+)\)/i);
    var honap=dParts?dParts[1]:"";
    var dnap=dParts?dParts[2]:"";
    var hnap=dParts?dParts[3]:"";

    var statTxt;
    if(nap.t.length>0){
      statTxt=nap.t.length+" tétel · "+nk+" kérdés";
    } else {
      statTxt=TN[nap.tip];
    }

    // Teljes napnév kiszámítása
    var teljesNapMap={"H":"Hétfő","K":"Kedd","Sze":"Szerda","Cs":"Csütörtök","P":"Péntek","Szo":"Szombat","V":"Vasárnap"};
    var teljesNap=teljesNapMap[hnap]||hnap;

    var fej=document.createElement("div");
    var van_tartalom=nap.t.length>0||nap.osszef;
    fej.className="nap-fej"+(van_tartalom?" kattintható":"");
    fej.innerHTML=
      '<div class="nap-datum-blokk">'+
        '<div class="nap-honap">'+honap+'</div>'+
        '<div class="nap-szam">'+dnap+'</div>'+
        '<div class="nap-honap-nev">'+hnap+'</div>'+
      '</div>'+
      '<div class="nap-info">'+
        '<div class="nap-tipus-row">'+
          '<span class="nap-hetnev">'+teljesNap+'</span>'+
          '<span class="tipus-pill">'+TN[nap.tip]+'</span>'+
          '<span class="nap-stat">'+statTxt+'</span>'+
          (nap.hosszu?'<span class="nap-hosszu">⚠ hosszú nap — szánjon rá többet vagy ossza két napra</span>':'')+
        '</div>'+
        '<div class="nap-tema">'+tema+'</div>'+
      '</div>'+
      (van_tartalom?'<div class="nap-nyil">▼</div>':'');

    var body=document.createElement("div");
    body.className="nap-body";

    if(van_tartalom){
      fej.onclick=function(){
        var open=body.style.display==="block";
        body.style.display=open?"none":"block";
        if(open) napDiv.classList.remove("nyitva");
        else napDiv.classList.add("nyitva");
      };

      // Ha van összefoglaló, azt renderelni
      if(nap.osszef && OSSZEF[nap.osszef]){
        var osDiv=document.createElement("div");
        osDiv.style.padding="14px 16px";
        var kUrl=(nap.osszef==="h3")?(KERDESSOR_AI_BASE+KERDESSOR_AI_PROBA):(KERDESSOR_AI_BASE+KERDESSOR_AI_FO);
        var kSzoveg=(nap.osszef==="h3")?"🎯 Próbateszt a kérdéssorban →":"🎯 Gyakorlás a kérdéssorban →";
        osDiv.innerHTML='<div class="nyomtat-gomb-sor"><a href="'+kUrl+'" target="_blank" rel="noopener" class="kerdessor-gomb">'+kSzoveg+'</a><button type="button" class="gyakorlo-gomb">🎯 Gyakorló mód</button><button type="button" class="nyomtat-gomb">🖨 Nyomtatás / PDF mentés</button></div>'+
          '<div class="gyakorlo-segito">Gyakorló mód: előbb próbáld meg fejből (vagy hangosan) megválaszolni a kérdést, majd kattints rá a válasz felfedéséhez.</div>'+
          OSSZEF[nap.osszef];
        body.appendChild(osDiv);
        var ngomb=osDiv.querySelector(".nyomtat-gomb");
        if(ngomb){ ngomb.onclick=function(e){ e.stopPropagation(); nyomtatOsszefoglalo(napDiv); }; }
        gyakorloElokeszit(osDiv);
        var ggomb=osDiv.querySelector(".gyakorlo-gomb");
        if(ggomb){ ggomb.onclick=function(e){
          e.stopPropagation();
          var be=osDiv.classList.toggle("gyakorlo-mod");
          ggomb.classList.toggle("aktiv", be);
          ggomb.textContent=be?"🎯 Gyakorló mód: BE":"🎯 Gyakorló mód";
          if(!be){ osDiv.querySelectorAll(".gy-kerdes.feldve").forEach(function(li){ li.classList.remove("feldve"); }); }
        }; }
      }

      // Tanulási tipp panel (tan/on napokon)
      if(nap.tipp){
        var tippWrap=document.createElement("div");
        tippWrap.style.padding="14px 16px 0";
        var ritmus=(nap.tip==="on")?ONRITMUS:ALTRITMUS;
        var napiHtml=nap.tippmegj?('<div class="tipp-napi">'+nap.tippmegj+'</div>'):'';
        tippWrap.innerHTML='<div class="tipp-panel"><div class="tipp-fej"><span class="tipp-fej-cim">📖 Hogyan dolgozd fel ezt a napot?</span><span class="tipp-fej-nyil">▼</span></div><div class="tipp-body">'+napiHtml+ritmus+'</div></div>';
        var panel=tippWrap.querySelector(".tipp-panel");
        var pfej=tippWrap.querySelector(".tipp-fej");
        pfej.onclick=function(e){e.stopPropagation();panel.classList.toggle("nyitva");};
        body.appendChild(tippWrap);
      }

      nap.t.forEach(function(k){
        var te=T[k]; if(!te) return;
        var tDiv=document.createElement("div");
        tDiv.className="tetel";
        var html='<div class="tetel-fej">'+
          '<span class="tetel-kod">'+k+'</span>'+
          '<span class="tetel-cim">'+te.c+'</span>'+
        '</div>';

        // 15p
        if(te.k15.length>0){
          html+='<div class="kerdes-csoport k15-csop"><div class="csoport-cim">15 pontos · Fő tétel</div>';
          te.k15.forEach(function(q){
            html+='<div class="kerdes k15"><span class="kerdes-jelolo">15p</span><span class="kerdes-szoveg">'+q+'</span></div>';
          });
          html+='</div>';
        }
        // 10p
        if(te.k10.length>0){
          html+='<div class="kerdes-csoport k10-csop"><div class="csoport-cim">10 pontos kérdések</div>';
          for(var i=0;i<te.k10.length;i+=2){
            html+='<div class="kerdes"><span class="kerdes-jelolo">10·'+te.k10[i]+'</span><span class="kerdes-szoveg">'+te.k10[i+1]+'</span></div>';
          }
          html+='</div>';
        }
        // 5p
        if(te.k5.length>0){
          html+='<div class="kerdes-csoport k5-csop"><div class="csoport-cim">5 pontos kérdések</div>';
          for(var i=0;i<te.k5.length;i+=2){
            html+='<div class="kerdes"><span class="kerdes-jelolo">5·'+te.k5[i]+'</span><span class="kerdes-szoveg">'+te.k5[i+1]+'</span></div>';
          }
          html+='</div>';
        }

        tDiv.innerHTML=html;
        body.appendChild(tDiv);
      });
    }

    // Kész-jelölő + MA jelvény a típus-sorba
    if(["tan","on","ism","vaz","pot"].indexOf(nap.tip)>-1){
      var trow=fej.querySelector(".nap-tipus-row");
      if(trow){
        var jel=document.createElement("div");
        jel.className="nap-jelolok";
        var keszNyomva=keszE(nap.d);
        jel.innerHTML=(MA_NAP===nap.d?'<span class="nap-ma-badge">MA</span>':'')+
          '<button type="button" class="nap-kesz-gomb'+(keszNyomva?' aktiv':'')+'">'+(keszNyomva?'✓ kész':'kész')+'</button>';
        trow.appendChild(jel);
        var kg=jel.querySelector(".nap-kesz-gomb");
        kg.onclick=function(e){
          e.stopPropagation();
          var most=!keszE(nap.d);
          keszSet(nap.d, most);
          napDiv.classList.toggle("kesz", most);
          kg.classList.toggle("aktiv", most);
          kg.innerHTML=most?'✓ kész':'kész';
          haladoFrissit();
        };
      }
    }
    napDiv.appendChild(fej);
    napDiv.appendChild(body);
    fo.appendChild(napDiv);
  });

  fo.scrollIntoView({behavior:"smooth",block:"start"});
}

function ugrasNapra(h,idx){
  show(h);
  setTimeout(function(){
    var napok=document.querySelectorAll("#fo .nap");
    if(napok[idx]){
      napok[idx].scrollIntoView({behavior:"smooth",block:"center"});
      napok[idx].classList.add("highlighted");
      // Automatikus kibontás
      var body=napok[idx].querySelector(".nap-body");
      var fej=napok[idx].querySelector(".nap-fej.kattintható");
      if(body&&fej&&body.style.display!=="block"){
        body.style.display="block";
        napok[idx].classList.add("nyitva");
      }
      setTimeout(function(){napok[idx].classList.remove("highlighted");},1400);
    }
  },100);
}

// ═══════════ Gyakorló mód: kérdés/válasz szétválasztása ═══════════
function gyakorloElokeszit(container){
  var szekek=container.querySelectorAll(".os-szek");
  szekek.forEach(function(szek){
    var cim=szek.querySelector(".os-szek-cim");
    if(!cim || cim.textContent.indexOf("pontos kérdések")===-1) return;
    szek.querySelectorAll("li").forEach(function(li){
      var html=li.innerHTML;
      var sv=html.indexOf("</strong>");
      if(sv===-1) return;
      var sep=html.indexOf(" \u2014 ", sv);
      if(sep===-1) return;
      li.innerHTML=html.substring(0, sep)+'<span class="gy-valasz">'+html.substring(sep)+'</span>';
      li.classList.add("gy-kerdes");
      li.addEventListener("click", function(e){
        if(container.classList.contains("gyakorlo-mod")){ e.stopPropagation(); li.classList.toggle("feldve"); }
      });
    });
  });
}

// ═══════════ Nyomtatás / PDF ═══════════
function nyomtatOsszefoglalo(napDiv){
  document.querySelectorAll(".nap.nyomtatando").forEach(function(n){ n.classList.remove("nyomtatando"); });
  napDiv.classList.add("nyomtatando");
  var b=napDiv.querySelector(".nap-body"); if(b) b.style.display="block";
  document.body.classList.add("nyomtat");
  window.print();
}
window.addEventListener("afterprint", function(){
  document.body.classList.remove("nyomtat");
  document.querySelectorAll(".nap.nyomtatando").forEach(function(n){ n.classList.remove("nyomtatando"); });
});

// ═══════════ Kereső ═══════════
var keresoInput=document.getElementById("kereso");
var keresoEred=document.getElementById("keresoEred");
if(keresoInput){
  keresoInput.addEventListener("input", function(){
    var q=this.value.trim().toLowerCase();
    keresoEred.innerHTML="";
    if(q.length<2){ keresoEred.classList.remove("aktiv"); return; }
    var tal=KERESO_INDEX.filter(function(it){ return it.szoveg.indexOf(q)>-1; });
    // duplikátum-szűrés kód szerint
    var latott={}, egyedi=[];
    tal.forEach(function(it){ if(!latott[it.kod]){ latott[it.kod]=1; egyedi.push(it); } });
    egyedi=egyedi.slice(0,12);
    if(egyedi.length===0){ keresoEred.innerHTML='<div class="kereso-nincs">Nincs találat erre: „'+this.value+'"</div>'; keresoEred.classList.add("aktiv"); return; }
    egyedi.forEach(function(it){
      var div=document.createElement("div");
      div.className="kereso-sor";
      div.innerHTML='<span class="kereso-kod">'+it.kod+'</span><span class="kereso-cim">'+it.cim+'</span><span class="kereso-nap">'+it.nap+'</span>';
      div.onclick=function(){ keresoEred.classList.remove("aktiv"); keresoInput.value=""; ugrasNapra(it.h, it.idx); };
      keresoEred.appendChild(div);
    });
    keresoEred.classList.add("aktiv");
  });
  document.addEventListener("click", function(e){
    if(!e.target.closest || !e.target.closest(".kereso-wrap")) keresoEred.classList.remove("aktiv");
  });
}

// ═══════════ Indítás: aktuális hét + ma kiemelése ═══════════
show(AKTIV_HET);
haladoFrissit();
if(MA_NAP){
  setTimeout(function(){
    var c=document.querySelector('#fo .nap[data-nap="'+MA_NAP+'"]');
    if(c) c.scrollIntoView({behavior:"smooth",block:"center"});
  }, 200);
}

</script>
</body>
